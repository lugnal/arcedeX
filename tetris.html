<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 8px}
h1{font-size:clamp(14px,4vw,18px);font-weight:700;letter-spacing:4px;color:#00e5ff;margin-bottom:10px;text-shadow:0 0 14px rgba(0,229,255,0.4)}
#wrap{display:flex;gap:16px;justify-content:center;align-items:flex-start}
canvas{display:block;border:1px solid #1a1a40;image-rendering:pixelated}
#side{display:flex;flex-direction:column;gap:10px;min-width:90px}
.panel{background:#0a0a1a;border:1px solid #1a1a40;border-radius:4px;padding:10px 12px}
.panel label{display:block;font-size:10px;letter-spacing:1px;color:#444;margin-bottom:4px}
.panel .val{font-size:18px;font-weight:700;color:#00e5ff;letter-spacing:1px}
.panel canvas.mini{display:block;margin:0 auto;border:none}
.btns{display:flex;flex-direction:column;gap:8px}
button{padding:7px 10px;border:1px solid #1a1a40;border-radius:4px;background:#0a0a1a;color:#00e5ff;cursor:pointer;font-size:10px;letter-spacing:1px;font-family:'Courier New',monospace;transition:all .15s;width:100%}
button:hover{background:#0d1f2d;border-color:#00e5ff}
#mobileCtrl{display:none;justify-content:center;gap:6px;padding:10px 4px;flex-wrap:wrap}
.mBtn{padding:12px 18px;border:1px solid #1a1a40;border-radius:4px;background:#0a0a1a;color:#00e5ff;font-size:16px;font-family:'Courier New',monospace;cursor:pointer;touch-action:manipulation;user-select:none;min-width:56px;width:auto}
.mBtn:active{background:#0d1f2d}
p.hint{font-size:10px;color:#333;margin-top:6px;letter-spacing:1px;text-align:center}
@media(max-width:500px){
  #mobileCtrl{display:flex}
  #wrap{gap:8px}
}
</style>
</head>
<body>

<h1>TETRIS</h1>

<div id="wrap">
  <canvas id="board" width="200" height="400"></canvas>
  <div id="side">
    <div class="panel">
      <label>GUARDAR (C)</label>
      <canvas class="mini" id="holdCanvas" width="70" height="70"></canvas>
    </div>
    <div class="panel">
      <label>PRÓXIMA</label>
      <canvas class="mini" id="nextCanvas" width="70" height="70"></canvas>
    </div>
    <div class="panel">
      <label>PONTOS</label>
      <div class="val" id="score">0</div>
    </div>
    <div class="panel">
      <label>LINHAS</label>
      <div class="val" id="lines">0</div>
    </div>
    <div class="panel">
      <label>NÍVEL</label>
      <div class="val" id="level">1</div>
    </div>
    <div class="btns">
      <button onclick="startGame()">JOGAR</button>
      <button onclick="togglePause()">PAUSAR</button>
      <button onclick="voltar()">Voltar</button>
    </div>
  </div>
</div>

<div id="mobileCtrl">
  <button class="mBtn" onclick="mAction('left')">◀</button>
  <button class="mBtn" onclick="mAction('down')">▼</button>
  <button class="mBtn" onclick="mAction('rotate')">↻</button>
  <button class="mBtn" onclick="mAction('right')">▶</button>
  <button class="mBtn" onclick="mAction('hold')">HOLD</button>
  <button class="mBtn" onclick="mAction('drop')">DROP</button>
</div>

<p class="hint">← → mover &nbsp;|&nbsp; ↑ girar &nbsp;|&nbsp; ↓ descer &nbsp;|&nbsp; ESPAÇO drop &nbsp;|&nbsp; C guardar</p>

<script>
const bc = document.getElementById("board");
const bx = bc.getContext("2d");
const nc = document.getElementById("nextCanvas");
const nx = nc.getContext("2d");
const hc = document.getElementById("holdCanvas");
const hx = hc.getContext("2d");
const SZ = 20, COLS = 10, ROWS = 20;

// Lock delay estilo TETR.IO
const LOCK_DELAY = 500;   // ms que a peça pode ficar no chão antes de travar
const MAX_RESETS = 15;    // quantas vezes mover/girar no chão reinicia o timer

const PIECES = [
  {shape:[[1,1,1,1]],         color:"#00e5ff"},
  {shape:[[1,0],[1,0],[1,1]], color:"#ff9500"},
  {shape:[[0,1],[0,1],[1,1]], color:"#3a86ff"},
  {shape:[[1,1],[1,1]],       color:"#ffcc00"},
  {shape:[[0,1,1],[1,1,0]],   color:"#00d26a"},
  {shape:[[1,1,0],[0,1,1]],   color:"#ff3860"},
  {shape:[[0,1,0],[1,1,1]],   color:"#a239ca"},
];

let board, cur, next, held = null, canHold = true, bag = [];
let score=0, lines=0, level=1;
let running=false, paused=false, over=false;
let dropInterval=800, gravityAcc=0, lastTs=0, raf=null;
let lockTimer=0, lockResets=0, lowestY=0;

// ── board ─────────────────────────────────────────
function newBoard(){
  return Array.from({length:ROWS}, ()=>Array(COLS).fill(0));
}

// ── pieces (sacola de 7, como no jogo oficial) ────
function nextId(){
  if(!bag.length){
    bag = [0,1,2,3,4,5,6];
    for(let i=bag.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [bag[i],bag[j]]=[bag[j],bag[i]];
    }
  }
  return bag.pop();
}

function makePiece(id){
  const p = PIECES[id];
  const shape = p.shape.map(r=>[...r]);
  return {id, shape, color:p.color, x:Math.floor((COLS-shape[0].length)/2), y:0};
}

function rotate(shape){
  const R=shape.length, C=shape[0].length;
  return Array.from({length:C}, (_,c)=>Array.from({length:R}, (_,r)=>shape[R-1-r][c]));
}

function voltar(){
  window.location.href="index.html";
}

// ── collision ─────────────────────────────────────
function fits(shape, ox, oy){
  return shape.every((row,r)=>row.every((v,c)=>{
    if(!v) return true;
    const px=ox+c, py=oy+r;
    return px>=0 && px<COLS && py<ROWS && (py<0 || !board[py][px]);
  }));
}

function grounded(){
  return !fits(cur.shape, cur.x, cur.y+1);
}

// ── spawn / game over ─────────────────────────────
// Coloca uma peça em jogo. Se não couber no topo, o jogo acaba.
function spawn(piece){
  cur = piece;
  lockTimer = 0;
  lockResets = 0;
  lowestY = cur.y;
  gravityAcc = 0;
  if(!fits(cur.shape, cur.x, cur.y)){
    gameOver();
    return false;
  }
  return true;
}

function gameOver(){
  running = false;
  over = true;
  paused = false;
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  drawBoard();
}

// ── place & clear ─────────────────────────────────
function place(){
  cur.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(v && cur.y+r >= 0) board[cur.y+r][cur.x+c] = cur.color;
  }));

  clearLines();

  canHold = true;
  const p = makePiece(next.id);
  next = makePiece(nextId());
  spawn(p);
}

function clearLines(){
  let cleared=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(v=>v)){
      board.splice(r,1);
      board.unshift(Array(COLS).fill(0));
      cleared++; r++;
    }
  }
  if(!cleared) return;
  lines += cleared;
  score += [0,100,300,500,800][cleared] * level;
  level  = Math.floor(lines/10)+1;
  dropInterval = Math.max(100, 800-level*70);
  updateHud();
}

function updateHud(){
  document.getElementById("score").textContent = score;
  document.getElementById("lines").textContent = lines;
  document.getElementById("level").textContent = level;
}

// ── lock delay ────────────────────────────────────
// Chamado depois de mover/girar com sucesso.
function afterMove(){
  if(grounded()){
    if(lockResets < MAX_RESETS){
      lockTimer = 0;
      lockResets++;
    }
  } else {
    lockTimer = 0;
  }
}

// ── movement ──────────────────────────────────────
function stepDown(){
  if(fits(cur.shape, cur.x, cur.y+1)){
    cur.y++;
    lockTimer = 0;
    if(cur.y > lowestY){ lowestY = cur.y; lockResets = 0; }
    return true;
  }
  return false; // no chão: NÃO trava aqui, quem trava é o lock delay
}

function moveH(dx){
  if(fits(cur.shape, cur.x+dx, cur.y)){
    cur.x += dx;
    afterMove();
  }
}

function softDrop(){
  if(stepDown()){ score += 1; updateHud(); }
}

function hardDrop(){
  let dist = 0;
  while(fits(cur.shape, cur.x, cur.y+1)){ cur.y++; dist++; }
  score += 2*dist;
  updateHud();
  place();
}

function tryRotate(){
  const r = rotate(cur.shape);
  const kicks = [[0,0],[1,0],[-1,0],[0,-1],[2,0],[-2,0]];
  for(const [dx,dy] of kicks){
    if(fits(r, cur.x+dx, cur.y+dy)){
      cur.shape = r; cur.x += dx; cur.y += dy;
      if(cur.y > lowestY){ lowestY = cur.y; lockResets = 0; }
      afterMove();
      return;
    }
  }
}

// ── hold ──────────────────────────────────────────
function hold(){
  if(!running || paused || !canHold) return;
  canHold = false;
  if(held === null){
    held = cur.id;
    const p = makePiece(next.id);
    next = makePiece(nextId());
    spawn(p);
  } else {
    const id = held;
    held = cur.id;
    spawn(makePiece(id));
  }
}

// ── ghost ─────────────────────────────────────────
function ghostY(){
  let gy=cur.y;
  while(fits(cur.shape, cur.x, gy+1)) gy++;
  return gy;
}

// ── draw helpers ──────────────────────────────────
function drawCell(ctx, x, y, color, sz){
  ctx.fillStyle = color;
  ctx.fillRect(x*sz+1, y*sz+1, sz-2, sz-2);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(x*sz+1, y*sz+1, sz-2, 4);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(x*sz+1, y*sz+sz-4, sz-2, 3);
}

function drawMini(ctx, id, color){
  ctx.fillStyle="#0a0a1a";
  ctx.fillRect(0,0,70,70);
  if(id === null) return;
  const sh = PIECES[id].shape;
  const offX = (5 - sh[0].length)/2;
  const offY = (5 - sh.length)/2;
  sh.forEach((row,r)=>row.forEach((v,c)=>{ if(v) drawCell(ctx,offX+c,offY+r,color,14); }));
}

function drawBoard(){
  bx.fillStyle="#060610";
  bx.fillRect(0,0,bc.width,bc.height);

  bx.strokeStyle="#0e0e22"; bx.lineWidth=1;
  for(let c=0;c<COLS;c++){bx.beginPath();bx.moveTo(c*SZ,0);bx.lineTo(c*SZ,ROWS*SZ);bx.stroke();}
  for(let r=0;r<ROWS;r++){bx.beginPath();bx.moveTo(0,r*SZ);bx.lineTo(COLS*SZ,r*SZ);bx.stroke();}

  board.forEach((row,r)=>row.forEach((v,c)=>{ if(v) drawCell(bx,c,r,v,SZ); }));

  if(!over){
    // ghost
    const gy = ghostY();
    if(gy !== cur.y){
      cur.shape.forEach((row,r)=>row.forEach((v,c)=>{
        if(!v) return;
        bx.fillStyle = cur.color+"28";
        bx.fillRect((cur.x+c)*SZ+1, (gy+r)*SZ+1, SZ-2, SZ-2);
        bx.strokeStyle = cur.color+"55"; bx.lineWidth=1;
        bx.strokeRect((cur.x+c)*SZ+1, (gy+r)*SZ+1, SZ-2, SZ-2);
      }));
    }

    // peça atual (escurece levemente conforme o lock delay se esgota)
    bx.globalAlpha = grounded() ? 1 - 0.45*Math.min(1, lockTimer/LOCK_DELAY) : 1;
    cur.shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v) drawCell(bx,cur.x+c,cur.y+r,cur.color,SZ); }));
    bx.globalAlpha = 1;
  }

  if(paused){
    bx.fillStyle="rgba(0,0,0,0.62)";
    bx.fillRect(0,0,bc.width,bc.height);
    bx.fillStyle="#00e5ff";
    bx.font="bold 16px 'Courier New'";
    bx.textAlign="center";
    bx.fillText("PAUSADO",100,200);
    bx.textAlign="left";
  }

  if(over){
    bx.fillStyle="rgba(0,0,0,0.78)";
    bx.fillRect(0,0,bc.width,bc.height);
    bx.textAlign="center";
    bx.fillStyle="#ff3860";
    bx.font="bold 18px 'Courier New'";
    bx.fillText("FIM DE JOGO",100,170);
    bx.fillStyle="#00e5ff";
    bx.font="bold 13px 'Courier New'";
    bx.fillText("PONTOS: "+score,100,196);
    bx.fillStyle="#777";
    bx.font="10px 'Courier New'";
    bx.fillText("JOGAR para reiniciar",100,220);
    bx.textAlign="left";
  }

  drawMini(nx, next ? next.id : null, next ? next.color : "#fff");
  drawMini(hx, held, canHold ? (held!==null?PIECES[held].color:"#fff") : "#555");
}

// ── game loop ─────────────────────────────────────
function loop(ts){
  if(!running){ raf=null; return; }
  raf = requestAnimationFrame(loop);

  const dt = Math.min(100, ts - (lastTs || ts));
  lastTs = ts;

  if(!paused){
    if(grounded()){
      // Peça apoiada: só trava quando o lock delay esgotar
      lockTimer += dt;
      gravityAcc = 0;
      if(lockTimer >= LOCK_DELAY){
        place();
        if(!running) return;
      }
    } else {
      lockTimer = 0;
      gravityAcc += dt;
      while(gravityAcc >= dropInterval){
        gravityAcc -= dropInterval;
        if(!stepDown()) break;
      }
    }
  }
  drawBoard();
}

// ── start / pause ─────────────────────────────────
function startGame(){
  if(document.activeElement) document.activeElement.blur();
  if(raf) cancelAnimationFrame(raf);
  board=newBoard();
  score=0; lines=0; level=1; dropInterval=800;
  held=null; canHold=true; bag=[];
  running=true; paused=false; over=false;
  lastTs=0; gravityAcc=0;
  next = makePiece(nextId());
  spawn(makePiece(nextId()));
  updateHud();
  if(running) raf=requestAnimationFrame(loop);
}

function togglePause(){
  if(document.activeElement) document.activeElement.blur();
  if(running){ paused=!paused; lastTs=0; }
}

// ── keyboard ──────────────────────────────────────
document.addEventListener("keydown", e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  if(!running || paused) return;
  if(e.key==="ArrowLeft")  moveH(-1);
  if(e.key==="ArrowRight") moveH(1);
  if(e.key==="ArrowDown")  softDrop();
  if(e.key==="ArrowUp")    tryRotate();
  if(e.key===" ")          hardDrop();
  if(e.key==="c" || e.key==="C") hold();
});

// ── mobile buttons ────────────────────────────────
function mAction(a){
  if(!running || paused) return;
  if(a==="left")   moveH(-1);
  if(a==="right")  moveH(1);
  if(a==="down")   softDrop();
  if(a==="rotate") tryRotate();
  if(a==="drop")   hardDrop();
  if(a==="hold")   hold();
}

// ── idle screen ───────────────────────────────────
(function(){
  bx.fillStyle="#060610"; bx.fillRect(0,0,bc.width,bc.height);
  for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
    if((c+r)%2===0){bx.fillStyle="#0e0e20";bx.fillRect(c*SZ,r*SZ,SZ,SZ);}
  }
  bx.fillStyle="#00e5ff"; bx.font="bold 14px 'Courier New'"; bx.textAlign="center";
  bx.fillText("TETRIS",100,185);
  bx.fillStyle="#333"; bx.font="10px 'Courier New'";
  bx.fillText("clique em JOGAR",100,210);
  bx.textAlign="left";
  nx.fillStyle="#0a0a1a"; nx.fillRect(0,0,70,70);
  hx.fillStyle="#0a0a1a"; hx.fillRect(0,0,70,70);
})();
</script>
</body>
</html>
