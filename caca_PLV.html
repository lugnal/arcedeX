<body>

    <div class="game-container">

        <header class="top">

            <div>
                <div class="logo">CAÇA-PALAVRAS</div>
                <div class="subtitle">ARCADEX WORD SEARCH</div>
            </div>

            <a href="index.html" class="back-button">
                VOLTAR
            </a>

        </header>

        <section class="controls">

            <div class="difficulty-area">

                <span>DIFICULDADE</span>

                <div class="difficulty-buttons">

                    <button class="difficulty active" data-level="easy">
                        FÁCIL
                    </button>

                    <button class="difficulty" data-level="medium">
                        MÉDIO
                    </button>

                    <button class="difficulty" data-level="hard">
                        DIFÍCIL
                    </button>

                </div>

            </div>

            <div class="stats">

                <span>PALAVRAS ENCONTRADAS</span>

                <strong id="found-count">
                    0/0
                </strong>

            </div>

        </section>

        <main class="game-area">

            <section class="board-section">

                <div id="message" class="message">
                    Encontre todas as palavras!
                </div>

                <div id="word-grid"></div>

            </section>

            <aside class="word-panel">

                <h2>PALAVRAS</h2>

                <p class="instruction">
                    Clique e arraste sobre as letras para encontrar as palavras.
                </p>

                <ul id="words"></ul>

            </aside>

        </main>

        <div class="bottom-info">
            <span>MOUSE / TOQUE</span>
            <span>ENCONTRE TODAS AS PALAVRAS</span>
        </div>

    </div>

    <script>
        "use strict";

        /* ==========================================
           CONFIGURAÇÃO DOS NÍVEIS
        ========================================== */

        const LEVELS = {

            easy: {
                size: 10,
                words: [
                    "",
                    "CAO",
                    "SOL",
                    "LUA",
                    "BOLA",
                    "CASA",
                    "MAR",
                    "FLOR"
                ]
            },

            medium: {
                size: 14,
                words: [
                    "ESCOLA",
                    "JARDIM",
                    "MUSICA",
                    "FUTEBOL",
                    "AMIZADE",
                    "CELULAR",
                    "INTERNET",
                    "PROJETO",
                    "COMPUTADOR",
                    "ARCADE"
                ]
            },

            hard: {
                size: 18,
                words: [
                    "PROGRAMACAO",
                    "JAVASCRIPT",
                    "ALGORITMO",
                    "TECNOLOGIA",
                    "COMPUTADOR",
                    "APLICATIVO",
                    "INTELIGENCIA",
                    "SOFTWARE",
                    "CODIFICACAO",
                    "PROGRAMADOR",
                    "DESENVOLVIMENTO",
                    "INOVACAO"
                ]
            }
        };

        /* ==========================================
           CORES
        ========================================== */

        const COLORS = [
            "color-0",
            "color-1",
            "color-2",
            "color-3",
            "color-4",
            "color-5",
            "color-6",
            "color-7",
            "color-8",
            "color-9",
            "color-10",
            "color-11"
        ];

        /* ==========================================
           DIREÇÕES
        ========================================== */

        const DIRECTIONS = [
            { row: 0, col: 1 },
            { row: 0, col: -1 },
            { row: 1, col: 0 },
            { row: -1, col: 0 },
            { row: 1, col: 1 },
            { row: 1, col: -1 },
            { row: -1, col: 1 },
            { row: -1, col: -1 }
        ];

        const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        /* ==========================================
           VARIÁVEIS
        ========================================== */

        let difficulty = "easy";
        let grid = [];
        let words = [];
        let foundWords = [];
        let selecting = false;
        let startCell = null;
        let selectedCells = [];

        /* ==========================================
           ELEMENTOS
        ========================================== */

        const gridElement = document.getElementById("word-grid");
        const wordsElement = document.getElementById("words");
        const messageElement = document.getElementById("message");
        const countElement = document.getElementById("found-count");
        const difficultyButtons =
            document.querySelectorAll(".difficulty");

        /* ==========================================
           FUNÇÃO ALEATÓRIA
        ========================================== */

        function randomItem(array) {
            return array[
                Math.floor(
                    Math.random() * array.length
                )
            ];
        }

        /* ==========================================
           EMBARALHAR
        ========================================== */

        function shuffle(array) {

            const result = [...array];

            for (
                let i = result.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    result[i],
                    result[j]
                ] = [
                    result[j],
                    result[i]
                ];
            }

            return result;
        }

        /* ==========================================
           CRIAR GRID VAZIO
        ========================================== */

        function createGrid(size) {

            return Array.from(
                { length: size },
                () => Array(size).fill("")
            );
        }

        /* ==========================================
           VERIFICAR SE CABE
        ========================================== */

        function canPlace(
            word,
            row,
            col,
            direction
        ) {

            const size = grid.length;

            for (
                let i = 0;
                i < word.length;
                i++
            ) {

                const r =
                    row +
                    direction.row * i;

                const c =
                    col +
                    direction.col * i;

                if (
                    r < 0 ||
                    r >= size ||
                    c < 0 ||
                    c >= size
                ) {
                    return false;
                }

                if (
                    grid[r][c] !== "" &&
                    grid[r][c] !== word[i]
                ) {
                    return false;
                }
            }

            return true;
        }

        /* ==========================================
           COLOCAR PALAVRA
        ========================================== */

        function placeWord(
            word,
            row,
            col,
            direction
        ) {

            for (
                let i = 0;
                i < word.length;
                i++
            ) {

                const r =
                    row +
                    direction.row * i;

                const c =
                    col +
                    direction.col * i;

                grid[r][c] = word[i];
            }
        }

        /* ==========================================
           GERAR TABULEIRO
        ========================================== */

        function generatePuzzle() {

            const size =
                LEVELS[difficulty].size;

            words = [
                ...LEVELS[difficulty].words
            ];

            words.sort(
                (a, b) =>
                    b.length - a.length
            );

            let success = false;

            for (
                let globalAttempt = 0;
                globalAttempt < 200 &&
                !success;
                globalAttempt++
            ) {

                grid = createGrid(size);
                success = true;

                for (const word of words) {

                    let placed = false;

                    const directions =
                        shuffle(DIRECTIONS);

                    for (
                        let attempt = 0;
                        attempt < 300;
                        attempt++
                    ) {

                        const direction =
                            randomItem(directions);

                        const row =
                            Math.floor(
                                Math.random() * size
                            );

                        const col =
                            Math.floor(
                                Math.random() * size
                            );

                        if (
                            canPlace(
                                word,
                                row,
                                col,
                                direction
                            )
                        ) {

                            placeWord(
                                word,
                                row,
                                col,
                                direction
                            );

                            placed = true;
                            break;
                        }
                    }

                    if (!placed) {
                        success = false;
                        break;
                    }
                }
            }

            /* Preenche as casas vazias */

            for (
                let r = 0;
                r < size;
                r++
            ) {

                for (
                    let c = 0;
                    c < size;
                    c++
                ) {

                    if (grid[r][c] === "") {

                        grid[r][c] =
                            randomItem(
                                LETTERS.split("")
                            );
                    }
                }
            }
        }

        /* ==========================================
           DESENHAR GRID
        ========================================== */

        function renderGrid() {

            gridElement.innerHTML = "";

            const size = grid.length;

            gridElement.style.gridTemplateColumns =
                `repeat(${size}, 1fr)`;

            for (
                let row = 0;
                row < size;
                row++
            ) {

                for (
                    let col = 0;
                    col < size;
                    col++
                ) {

                    const cell =
                        document.createElement("div");

                    cell.className = "cell";

                    cell.textContent =
                        grid[row][col];

                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    cell.addEventListener(
                        "mousedown",
                        startSelection
                    );

                    cell.addEventListener(
                        "mouseenter",
                        moveSelection
                    );

                    cell.addEventListener(
                        "touchstart",
                        startTouch,
                        { passive: false }
                    );

                    cell.addEventListener(
                        "touchmove",
                        moveTouch,
                        { passive: false }
                    );

                    cell.addEventListener(
                        "touchend",
                        endTouch,
                        { passive: false }
                    );

                    gridElement.appendChild(cell);
                }
            }
        }

        /* ==========================================
           LISTA DE PALAVRAS
        ========================================== */

        function renderWords() {

            wordsElement.innerHTML = "";

            words.forEach(word => {

                const li =
                    document.createElement("li");

                li.textContent = word;
                li.dataset.word = word;

                wordsElement.appendChild(li);
            });
        }

        /* ==========================================
           ATUALIZAR CONTADOR
        ========================================== */

        function updateCounter() {

            countElement.textContent =
                `${foundWords.length}/${words.length}`;
        }

        /* ==========================================
           PEGAR CÉLULA
        ========================================== */

        function getCell(row, col) {

            return gridElement.querySelector(
                `.cell[data-row="${row}"][data-col="${col}"]`
            );
        }

        /* ==========================================
           COMEÇAR SELEÇÃO
        ========================================== */

        function startSelection(event) {

            event.preventDefault();

            const cell =
                event.currentTarget;

            startCell = {
                row: Number(cell.dataset.row),
                col: Number(cell.dataset.col)
            };

            selecting = true;

            selectedCells = [
                startCell
            ];

            showSelection();
        }

        /* ==========================================
           MOVER MOUSE
        ========================================== */

        function moveSelection(event) {

            if (!selecting) {
                return;
            }

            const cell =
                event.currentTarget;

            const row =
                Number(cell.dataset.row);

            const col =
                Number(cell.dataset.col);

            updateSelection(row, col);
        }

        /* ==========================================
           ATUALIZAR SELEÇÃO
        ========================================== */

        function updateSelection(
            endRow,
            endCol
        ) {

            if (!startCell) {
                return;
            }

            const rowDiff =
                endRow - startCell.row;

            const colDiff =
                endCol - startCell.col;

            const isStraight =
                rowDiff === 0 ||
                colDiff === 0 ||
                Math.abs(rowDiff) ===
                Math.abs(colDiff);

            if (!isStraight) {
                return;
            }

            const steps =
                Math.max(
                    Math.abs(rowDiff),
                    Math.abs(colDiff)
                );

            const rowStep =
                steps === 0
                    ? 0
                    : rowDiff / steps;

            const colStep =
                steps === 0
                    ? 0
                    : colDiff / steps;

            selectedCells = [];

            for (
                let i = 0;
                i <= steps;
                i++
            ) {

                selectedCells.push({
                    row:
                        startCell.row +
                        rowStep * i,

                    col:
                        startCell.col +
                        colStep * i
                });
            }

            showSelection();
        }

        /* ==========================================
           MOSTRAR SELEÇÃO
        ========================================== */

        function showSelection() {

            document
                .querySelectorAll(".cell.selected")
                .forEach(cell => {

                    cell.classList.remove(
                        "selected"
                    );
                });

            selectedCells.forEach(position => {

                const cell =
                    getCell(
                        position.row,
                        position.col
                    );

                if (cell) {

                    cell.classList.add(
                        "selected"
                    );
                }
            });
        }

        /* ==========================================
           FINALIZAR SELEÇÃO
        ========================================== */

        function finishSelection() {

            if (!selecting) {
                return;
            }

            selecting = false;

            const selectedWord =
                selectedCells
                    .map(position =>
                        grid[
                            position.row
                        ][
                            position.col
                        ]
                    )
                    .join("");

            const reversed =
                selectedWord
                    .split("")
                    .reverse()
                    .join("");

            let wordFound = null;

            if (words.includes(selectedWord)) {

                wordFound = selectedWord;

            } else if (words.includes(reversed)) {

                wordFound = reversed;
            }

            if (
                wordFound &&
                !foundWords.includes(wordFound)
            ) {

                markWord(
                    wordFound,
                    selectedCells
                );

            } else {

                messageElement.textContent =
                    "Tente novamente!";

                clearSelection();
            }

            startCell = null;
            selectedCells = [];
        }

        /* ==========================================
           MARCAR PALAVRA
        ========================================== */

        function markWord(
            word,
            cells
        ) {

            foundWords.push(word);

            const color =
                COLORS[
                    (foundWords.length - 1) %
                    COLORS.length
                ];

            cells.forEach(position => {

                const cell =
                    getCell(
                        position.row,
                        position.col
                    );

                if (cell) {

                    cell.classList.remove(
                        "selected"
                    );

                    cell.classList.add(
                        "found"
                    );

                    cell.classList.add(
                        color
                    );
                }
            });

            const wordItem =
                wordsElement.querySelector(
                    `li[data-word="${word}"]`
                );

            if (wordItem) {

                wordItem.classList.add(
                    "found"
                );

                wordItem.classList.add(
                    color
                );
            }

            updateCounter();

            if (
                foundWords.length ===
                words.length
            ) {

                messageElement.textContent =
                    "🎉 PARABÉNS! VOCÊ ENCONTROU TODAS AS PALAVRAS!";

            } else {

                messageElement.textContent =
                    `✓ ${word} ENCONTRADA!`;
            }
        }

        /* ==========================================
           LIMPAR SELEÇÃO
        ========================================== */

        function clearSelection() {

            document
                .querySelectorAll(".cell.selected")
                .forEach(cell => {

                    cell.classList.remove(
                        "selected"
                    );
                });
        }

        /* ==========================================
           TOQUE
        ========================================== */

        function startTouch(event) {

            event.preventDefault();

            const touch =
                event.touches[0];

            const element =
                document.elementFromPoint(
                    touch.clientX,
                    touch.clientY
                );

            if (
                !element ||
                !element.classList.contains("cell")
            ) {
                return;
            }

            startCell = {
                row: Number(element.dataset.row),
                col: Number(element.dataset.col)
            };

            selecting = true;

            selectedCells = [
                startCell
            ];

            showSelection();
        }

        function moveTouch(event) {

            if (!selecting) {
                return;
            }

            event.preventDefault();

            const touch =
                event.touches[0];

            const element =
                document.elementFromPoint(
                    touch.clientX,
                    touch.clientY
                );

            if (
                !element ||
                !element.classList.contains("cell")
            ) {
                return;
            }

            updateSelection(
                Number(element.dataset.row),
                Number(element.dataset.col)
            );
        }

        function endTouch(event) {

            event.preventDefault();

            finishSelection();
        }

        /* ==========================================
           MOUSE SOLTO
        ========================================== */

        document.addEventListener(
            "mouseup",
            () => {

                if (selecting) {
                    finishSelection();
                }
            }
        );

        /* ==========================================
           TROCAR DIFICULDADE
        ========================================== */

        difficultyButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    difficultyButtons.forEach(item => {

                        item.classList.remove(
                            "active"
                        );
                    });

                    button.classList.add(
                        "active"
                    );

                    difficulty =
                        button.dataset.level;

                    startGame();
                }
            );
        });

        /* ==========================================
           INICIAR JOGO
        ========================================== */

        function startGame() {

            foundWords = [];
            selecting = false;
            startCell = null;
            selectedCells = [];

            generatePuzzle();
            renderGrid();
            renderWords();
            updateCounter();

            messageElement.textContent =
                "Encontre todas as palavras!";
        }

        /* ==========================================
           INICIAR
        ========================================== */

        startGame();

    </script>
