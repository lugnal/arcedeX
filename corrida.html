<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highway Chaos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0d0d;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  display: block;
  position: fixed;
  top: 0; left: 0;
}

#ui {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 14px 24px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  pointer-events: none;
  z-index: 10;
}

.stat { text-align: center; }
.stat-label { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.5); }
.stat-val { font-size: 22px; font-weight: 700; }

/* OVERLAYS */
#menu-screen,
#gameover-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.8);
  z-index: 100;
}

#gameover-screen { display: none; }

.panel {
  background: #1a1a1a;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 40px 44px;
  text-align: center;
  min-width: 320px;
}

.game-title {
  font-size: 38px;
  font-weight: 900;
  color: #00e5ff;
  letter-spacing: 3px;
}

.game-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 4px;
  margin-bottom: 32px;
}

.crash-icon { font-size: 56px; margin-bottom: 8px; }

.over-title {
  font-size: 32px;
  font-weight: 900;
  color: #ff3c3c;
  letter-spacing: 3px;
  margin-bottom: 4px;
}

.over-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 2px;
  margin-bottom: 24px;
}

.results {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}

.result-box {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px 10px;
}

.result-box .rlabel {
  font-size: 10px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.result-box .rval {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
}

.rval.gold { color: #ffd600; }

.btn-row {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 14px 10px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: transform 0.1s, opacity 0.1s;
}

.btn:hover { opacity: 0.85; }
.btn:active { transform: scale(0.96); }

.btn-menu {
  background: rgba(255,255,255,0.1);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
}

.btn-play {
  background: #00e5ff;
  color: #000;
}

.btn-start {
  width: 100;
  padding: 16px;
  border-radius: 14px;
  border: none;
  background: #00e5ff;
  color: #000;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.1s;
}

.btn-start:hover { opacity: 0.9; }
.btn-start:active { transform: scale(0.97); }

.hint {
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  margin-top: 14px;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div class="stat">
    <div class="stat-label">SCORE</div>
    <div class="stat-val" id="hud-score">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">MOEDAS</div>
    <div class="stat-val" id="hud-coins" style="color:#ffd600">0</div>
  </div>
</div>

<!-- MENU -->
<div id="menu-screen">
  <div class="panel">
    <div class="game-title">HIGHWAY</div>
    <div class="game-sub">C H A O S</div>
    <button class="btn-start" id="btn-start">&#9654; JOGAR</button>
    <button onclick="Voltar()" class="btn-start"> VOLTAR</button>
    <div class="hint">Use &larr; &rarr; para mover &nbsp;|&nbsp; Colete moedas douradas</div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover-screen">
  <div class="panel">
    <div class="crash-icon">&#128165;</div>
    <div class="over-title">GAME OVER</div>
    <div class="over-sub">VOC&Ecirc; BATEU</div>
    <div class="results">
      <div class="result-box">
        <div class="rlabel">Pontuação</div>
        <div class="rval" id="final-score">0</div>
      </div>
      <div class="result-box">
        <div class="rlabel">Moedas</div>
        <div class="rval gold" id="final-coins">0</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-menu" id="btn-menu">&larr; Menu</button>
      <button class="btn btn-play" id="btn-retry">&#8635; Tentar Novamente</button>
    </div>
  </div>
</div>

<script>
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;

var W = canvas.width;
var H = canvas.height;
var LANES = 4;
var LANE_W = W / LANES;

var player, cars, coins, particles, score, coinCount, speed, running;
var roadOff = 0;
var carTimer, coinTimer;

function resetState() {
  player = { x: W/2 - 25, y: H - 150, w: 50, h: 80, spd: 7 };
  cars = [];
  coins = [];
  particles = [];
  score = 0;
  coinCount = 0;
  speed = 4.5;
  roadOff = 0;
  running = false;
}

function Voltar() {
    window.location.href='index.html'
}

resetState();

var keys = {};
window.addEventListener("keydown", function(e) { keys[e.key] = true; });
window.addEventListener("keyup",   function(e) { keys[e.key] = false; });

document.getElementById("btn-start").addEventListener("click", startGame);

document.getElementById("btn-retry").addEventListener("click", function() {
  document.getElementById("gameover-screen").style.display = "none";
  startGame();
});

document.getElementById("btn-menu").addEventListener("click", function() {
  document.getElementById("gameover-screen").style.display = "none";
  document.getElementById("menu-screen").style.display = "flex";
});

function spawnCar() {
  if (!running) return;
  var lane = Math.floor(Math.random() * LANES);
  var colors = ["#ff3c3c","#ff8800","#cc44ff","#ff1493","#44ff88","#3399ff"];
  cars.push({
    x: lane * LANE_W + LANE_W/2 - 25,
    y: -100,
    w: 50, h: 80,
    col: colors[Math.floor(Math.random() * colors.length)]
  });
}

function spawnCoin() {
  if (!running) return;
  var lane = Math.floor(Math.random() * LANES);
  coins.push({ x: lane * LANE_W + LANE_W/2, y: -60, r: 14 });
}

function collide(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function burst(x, y, col, n) {
  for (var i = 0; i < n; i++) {
    var ang = Math.random() * Math.PI * 2;
    var s   = 2 + Math.random() * 5;
    particles.push({ x:x, y:y, vx:Math.cos(ang)*s, vy:Math.sin(ang)*s, life:1, col:col });
  }
}

function darken(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return "rgb("+Math.floor(r*.55)+","+Math.floor(g*.55)+","+Math.floor(b*.55)+")";
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function drawCar(x, y, w, h, col, isPlayer) {
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(x+w/2, y+h+3, w*.44, 6, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = darken(col);
  rr(x+4, y+h*.25, w-8, h*.55, 5);
  ctx.fill();

  ctx.fillStyle = col;
  rr(x, y+h*.1, w, h*.8, 7);
  ctx.fill();

  ctx.fillStyle = isPlayer ? "rgba(0,240,255,.35)" : "rgba(160,210,255,.25)";
  if (isPlayer) { rr(x+6, y+h*.12, w-12, h*.28, 4); }
  else          { rr(x+6, y+h*.50, w-12, h*.25, 4); }
  ctx.fill();

  ctx.fillStyle = "#1a1a1a";
  rr(x-4, y+h*.15, 9, 15, 3); ctx.fill();
  rr(x+w-5, y+h*.15, 9, 15, 3); ctx.fill();
  rr(x-4, y+h*.65, 9, 15, 3); ctx.fill();
  rr(x+w-5, y+h*.65, 9, 15, 3); ctx.fill();

  if (isPlayer) {
    ctx.fillStyle = "#ff4444";
    ctx.fillRect(x+4,    y+h*.83, 11, 5);
    ctx.fillRect(x+w-15, y+h*.83, 11, 5);
  } else {
    ctx.fillStyle = "#fffaaa";
    ctx.fillRect(x+4,    y+h*.05, 11, 5);
    ctx.fillRect(x+w-15, y+h*.05, 11, 5);
  }
  ctx.restore();
}

function update() {
  if (!running) return;

  roadOff = (roadOff + speed) % 60;

  if (keys["ArrowLeft"]  && player.x > 0)          player.x -= player.spd;
  if (keys["ArrowRight"] && player.x < W-player.w)  player.x += player.spd;

  for (var i = 0; i < cars.length; i++) {
    cars[i].y += speed;
    if (collide(player, cars[i])) {
      burst(player.x + player.w/2, player.y + player.h/2, "#ff3c3c", 22);
      endGame();
      return;
    }
  }

  for (var j = coins.length - 1; j >= 0; j--) {
    coins[j].y += speed;
    var c = coins[j];
    var dx = player.x + player.w/2 - c.x;
    var dy = player.y + player.h/2 - c.y;
    if (Math.sqrt(dx*dx + dy*dy) < 52) {
      burst(c.x, c.y, "#ffd600", 9);
      coins.splice(j, 1);
      coinCount++;
    }
  }

  for (var k = particles.length - 1; k >= 0; k--) {
    var p = particles[k];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.04;
    if (p.life <= 0) particles.splice(k, 1);
  }

  cars  = cars.filter(function(c){ return c.y < H + 120; });
  coins = coins.filter(function(c){ return c.y < H + 80; });

  score++;
  speed += 0.0015;

  document.getElementById("hud-score").innerText = score;
  document.getElementById("hud-coins").innerText = coinCount;
}

function draw() {
  ctx.fillStyle = "#1c1c1c";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.setLineDash([30, 30]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  for (var i = 1; i < LANES; i++) {
    var lx = i * LANE_W;
    ctx.beginPath();
    ctx.moveTo(lx, -roadOff);
    ctx.lineTo(lx, H + 60 - roadOff);
    ctx.stroke();
  }
  ctx.restore();

  coins.forEach(function(c) {
    ctx.save();
    var g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r*2.2);
    g.addColorStop(0, "rgba(255,214,0,.45)");
    g.addColorStop(1, "rgba(255,214,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r*2.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffd600";
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffed80";
    ctx.beginPath(); ctx.arc(c.x-3, c.y-3, c.r*.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  cars.forEach(function(c) { drawCar(c.x, c.y, c.w, c.h, c.col, false); });
  drawCar(player.x, player.y, player.w, player.h, "#00e5ff", true);

  particles.forEach(function(p) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  document.getElementById("menu-screen").style.display = "none";
  document.getElementById("gameover-screen").style.display = "none";
  resetState();
  running = true;
  clearInterval(carTimer);
  clearInterval(coinTimer);
  carTimer  = setInterval(spawnCar,  900);
  coinTimer = setInterval(spawnCoin, 1300);
}

function endGame() {
  running = false;
  clearInterval(carTimer);
  clearInterval(coinTimer);
  document.getElementById("final-score").innerText = score;
  document.getElementById("final-coins").innerText = coinCount;
  setTimeout(function() {
    document.getElementById("gameover-screen").style.display = "flex";
  }, 500);
}

loop();
</script>
</body>
</html>
