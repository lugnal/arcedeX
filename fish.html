<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pixel Fishing | ArcadeX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{--bg:#080d1b;--panel:#111b31;--bd:#344c72;--cy:#52f4ff;--ye:#ffe477;--gr:#80ffae}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f0f5ff;font:21px 'VT323',monospace}
header{display:flex;align-items:center;justify-content:space-between;padding:17px 5%;background:#0b1021;border-bottom:2px solid #243453}
.logo{color:var(--cy);font:14px 'Press Start 2P',monospace;text-shadow:3px 3px #173d75}
button{font-family:'Press Start 2P',monospace;font-size:10px;cursor:pointer}
.back{color:#fff;background:0;border:2px solid var(--bd);padding:12px}.back:hover{border-color:var(--cy)}
main{width:min(1050px,94%);margin:24px auto}
h1{color:var(--ye);font:clamp(17px,3vw,27px) 'Press Start 2P',monospace;text-align:center;line-height:1.7;text-shadow:4px 4px #694a28;margin:12px 0}
.subtitle{text-align:center;color:#a8bddc;margin:8px 0 20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat,.panel{background:var(--panel);border:2px solid var(--bd);padding:12px}
.stat label{display:block;color:#91a9d0;font-size:17px}.stat strong{font-size:28px;color:var(--ye)}
.scene{border:3px solid #52678e;box-shadow:0 8px 0 #050914;overflow:hidden}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation}
.status{background:var(--panel);border:2px solid var(--bd);padding:15px;text-align:center;color:var(--cy);margin-top:12px;min-height:57px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.tab{background:#0b1427;color:#9caecb;border:2px solid var(--bd);padding:14px 4px;line-height:1.6}
.tab.on{background:var(--ye);color:#2a1d08;border-color:var(--ye)}
.tp{display:none;margin-top:12px}.tp.on{display:block}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.action{min-height:60px;color:#10182a;background:var(--cy);border:0;padding:13px;box-shadow:0 4px 0 #168d9a;line-height:1.8}
.action:hover{filter:brightness(1.15)}.action:active{transform:translateY(3px);box-shadow:none}
.action:disabled{background:#59667b;color:#b8c1d0;box-shadow:0 4px 0 #343e50;cursor:not-allowed}
.secondary{background:#d1a4ff;box-shadow:0 4px 0 #8052b4}
.panel h2{font:11px 'Press Start 2P',monospace;color:var(--ye);line-height:1.8;margin:4px 0 12px}
.upgrade{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #293b59}
.upgrade strong{color:var(--cy);display:block}.upgrade small{display:block;color:#9caecb;font-size:18px}
.pips{color:var(--ye)!important;letter-spacing:2px}
.buy{color:#0a1527;background:var(--gr);border:0;padding:12px 9px;font-size:9px;white-space:nowrap}
.buy:disabled{background:#4e5b6f;cursor:not-allowed}
.bk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fc{background:#0b1427;border:2px solid;padding:8px 4px;text-align:center}
.fc canvas{width:64px;height:40px;margin:0 auto 4px}.fc strong{display:block;color:var(--cy);font-size:20px}.fc small{display:block;color:#a5b7d4;font-size:17px;line-height:1.15}
.log{max-height:140px;overflow:auto;color:#a8bddc;font-size:18px}.log div{padding:3px 0}
footer{text-align:center;padding:25px;color:#647794}
@media(max-width:700px){.bk{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.logo{font-size:10px}.back{font-size:8px;padding:9px}.stat strong{font-size:23px}.action,.tab{font-size:8px}}
</style></head><body>
<header><div class="logo">ARCADEX</div><button class="back" onclick="location.href='index.html'">← VOLTAR</button></header>
<main>
<h1>PIXEL FISHING</h1><p class="subtitle">Pesque, venda e complete o seu livro de espécies!</p>
<section class="stats">
<div class="stat"><label>🪙 DINHEIRO</label><strong id="money">100</strong></div>
<div class="stat"><label>🐟 CAPTURADOS</label><strong id="total">0</strong></div>
<div class="stat"><label>🎣 VARA</label><strong id="rodLevel">Nível 1</strong></div></section>
<div class="scene"><canvas id="game" width="480" height="300"></canvas></div>
<div class="status" id="status" aria-live="polite">Prepare sua vara para pescar!</div>
<nav class="tabs"><button class="tab on" onclick="tab(0)">🎣 PESCAR</button><button class="tab" onclick="tab(1)">⬆ MELHORIAS</button><button class="tab" onclick="tab(2)">📖 LIVRO</button></nav>
<section class="tp on" id="t0">
<div class="actions"><button class="action" id="castBtn" onclick="act()">🎣 LANÇAR LINHA</button><button class="action secondary" id="sellBtn" onclick="sell()">🪙 VENDER PEIXES</button></div>
<div class="panel" style="margin-top:12px"><h2>📜 DIÁRIO DE PESCA</h2><div class="log" id="log"><div>Bem-vindo ao lago!</div></div></div></section>
<section class="tp" id="t1"><div class="panel"><h2>⬆ MELHORIAS</h2><div id="ups"></div></div></section>
<section class="tp" id="t2"><div class="panel"><h2>📖 LIVRO DE PEIXES</h2><p id="bkInfo" style="margin:0 0 12px;color:#9caecb"></p><div class="bk" id="bk"></div></div></section>
</main>
<script>
const $=i=>document.getElementById(i),c=$("game").getContext("2d"),W=480,H=300;
const R=(x,y,w,h,k)=>{c.fillStyle=k;c.fillRect(Math.round(x),Math.round(y),w,h)};
const lerp=(a,b,t)=>a+(b-a)*t,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const p=hx(a),q=hx(b);return"#"+p.map((v,i)=>(v+(q[i]-v)*t|0).toString(16).padStart(2,"0")).join("")};
const RC=["#b8c4d6","#80ffae","#52a8ff","#d18bff","#ffe477","#ff6b9d"],RN=["Comum","Incomum","Raro","Épico","Lendário","Mítico"];
// id, nome, cor corpo, cor nadadeira, raridade, dificuldade(1-5), valor, forma
const F=[
["lambari","Lambari","#c9d6df","#7f98a8",0,1,8,"f"],["tilapia","Tilápia","#8fae7a","#5a7a4a",0,1,10,"f"],["bagre","Bagre","#8a7560","#54443a",0,2,12,"l"],
["carpa","Carpa","#e08a3c","#a85a22",1,2,20,"f"],["traira","Traíra","#6f8a45","#43572a",1,2,22,"l"],["perca","Perca azul","#4f9be0","#2b5fa8",1,3,26,"f"],
["truta","Truta arco-íris","#e8a0c8","#52c8a8",2,3,40,"f"],["baiacu","Baiacu","#e8d070","#b89a3a",2,3,45,"r"],["enguia","Enguia elétrica","#5a8a7a","#ffe477",2,4,50,"l"],["palhaco","Peixe-palhaço","#ff8a3c","#ffffff",2,3,55,"f"],
["anjo","Peixe-anjo","#9ae0ff","#ffe477",3,4,80,"f"],["arraia","Arraia","#8a7ac8","#4a3a88",3,4,90,"k"],["pirarucu","Pirarucu","#c8503c","#7a2a22",3,5,110,"l"],["espada","Peixe-espada","#6ab0d8","#2a5a88",3,5,120,"s"],
["dourado","Dourado real","#ffd24a","#e8962a",4,5,200,"f"],["lanterna","Peixe-lanterna","#3a4a88","#7affd8",4,5,230,"r"],["tubarao","Tubarão","#7a8aa0","#4a5a70",4,5,280,"s"],
["koi","Koi cósmico","#ffffff","#ff4a6a",5,5,500,"f"],["leviata","Leviatã","#6a3a9a","#c88aff",5,5,650,"s"],["estrela","Peixe-estrela","#ffe47a","#ffffff",5,5,800,"r"]
].map(a=>({id:a[0],n:a[1],c:a[2],f:a[3],r:a[4],d:a[5],v:a[6],s:a[7]}));
// [cor(0 corpo,1 nadadeira,2 barriga,3 olho), x,y,w,h]
const SH={f:[[0,3,1,8,7],[0,2,2,10,5],[1,0,1,3,3],[1,0,5,3,3],[1,6,0,3,1],[2,4,6,6,1],[3,10,3,1,1]],
r:[[0,3,0,8,9],[0,2,1,10,7],[1,0,3,3,3],[2,4,6,6,2],[3,9,3,1,1],[1,6,-1,1,1]],
l:[[0,2,3,12,4],[1,0,2,2,6],[1,5,2,5,1],[2,4,6,8,1],[3,12,3,1,1]],
s:[[0,2,2,13,6],[0,4,1,9,1],[1,7,-1,3,3],[1,0,0,3,3],[1,0,6,3,3],[2,5,6,8,2],[3,13,3,1,1]],
k:[[0,4,1,7,7],[0,1,3,13,3],[1,0,4,2,1],[2,5,6,5,1],[3,10,3,1,1]]};
function spr(g,x,y,f,s,fl,sil){for(const[k,px,py,w,h]of SH[f.s]){g.fillStyle=sil?"#0a1226":[f.c,f.f,"#f4f8ff","#101830"][k];g.fillRect(Math.round(x+(fl?14-px-w:px)*s),Math.round(y+(py+1)*s),w*s,h*s)}}

const D0={money:100,total:0,rod:1,line:1,bait:1,basket:5};
let data=load();
function load(){try{const s=JSON.parse(localStorage.getItem("pixelFishingSave")),d={...D0,bag:[],caught:{},...s};d.bag=(d.bag||[]).filter(i=>F.some(f=>f.id==i));return d}catch{return{...D0,bag:[],caught:{}}}}
const save=()=>{try{localStorage.setItem("pixelFishingSave",JSON.stringify(data))}catch{}};
const val=f=>Math.round(f.v*(1+.04*(data.rod-1)));
function wts(){const n=[0,0,0,0,0,0];F.forEach(f=>n[f.r]++);const B=[50,28,14,6,1.8,.4],L=(data.line-1)*.12+(data.bait-1)*.04;return F.map(f=>B[f.r]/n[f.r]*(f.r>=2?1+L*f.r:Math.max(.4,1-L*.5)))}
function pick(){const w=wts();let r=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<F.length;i++){r-=w[i];if(r<=0)return F[i]}return F[0]}

// ===== estado =====
let st="idle",T=0,time=0,tgt=null,bob={x:340,y:212},b0={x:340,y:212},hopT=0,hopY=0,P=[],FL=[],zc=.5,zw=.2,sp=3,m=0,armUp=0,ang=-.6,bend=2,wait=3,logs=[];
let tip={x:0,y:0},hand={x:254,y:126};
const LB={idle:"🎣 LANÇAR LINHA",casting:"LANÇANDO...",waiting:"✋ RECOLHER LINHA",bite:"❗ FISGAR!",reel:"🎯 PUXAR!",pull:"RECOLHENDO...",caught:"🎣 LANÇAR NOVAMENTE"};
const say=t=>$("status").textContent=t;
function log(t){logs.unshift(t);logs=logs.slice(0,12);$("log").innerHTML=logs.map(i=>`<div>${i}</div>`).join("")}
function go(s){st=s;T=0;$("castBtn").textContent=LB[s];$("castBtn").disabled=s=="casting"||s=="pull"}
function burst(x,y,k,n){for(let i=0;i<n;i++)P.push({x,y,vx:rnd(-60,60),vy:rnd(-110,-20),l:rnd(.4,.9),k})}
function act(){
 if(st=="idle"||st=="caught"){if(data.bag.length>=data.basket)return say("Sua cesta está cheia! Venda os peixes primeiro.");tgt=null;go("casting");say("Lançando a linha...")}
 else if(st=="waiting"){go("idle");say("Você recolheu a linha sem pegar nada.")}
 else if(st=="bite"){go("reel");sp=2+tgt.d*.7;zw=cl(.34-tgt.d*.04+(data.rod-1)*.02+(data.line-1)*.008,.07,.4);zc=rnd(.2+zw/2,.8-zw/2);say("Clique quando a barra estiver na zona verde!")}
 else if(st=="reel"){if(Math.abs(m-zc)<=zw/2){b0={...bob};go("pull");burst(bob.x,bob.y,"#bfefff",14);say("Puxando!")}else fail()}
}
function fail(){go("idle");burst(bob.x,bob.y,"#bfefff",10);say(`O ${tgt.n} escapou! Tente de novo.`)}
function done(){const f=tgt,nw=!data.caught[f.id];data.bag.push(f.id);data.caught[f.id]=(data.caught[f.id]||0)+1;data.total++;save();hopT=.8;go("caught");burst(hand.x+6,hand.y-34,RC[f.r],18);
 if(nw)FL.push({x:170,y:98,t:"📖 NOVA ESPÉCIE!",l:2.4});say(`Você pescou: ${f.n} (${RN[f.r]})! Vale ${val(f)} 🪙.`);log(`${f.n} capturado!`);updateUI()}
function sell(){
 if(!data.bag.length)return say("Você ainda não tem peixes para vender.");
 const t=data.bag.reduce((s,i)=>s+val(F.find(f=>f.id==i)),0),n=data.bag.length;data.money+=t;data.bag=[];save();updateUI();say(`Você vendeu ${n} peixe(s) por ${t} moedas!`);log(`Venda: +${t} moedas.`)}

// ===== melhorias =====
const B={rod:100,line:120,bait:90,basket:80},UP=[["rod","🎣","Vara de pesca","Menos espera e zona de captura maior"],["line","🧵","Linha reforçada","Mais chance de peixes raros"],["bait","🪱","Isca premium","Peixes mordem mais rápido"],["basket","🧺","Cesta maior","+5 de capacidade por nível"]];
const lv=k=>k=="basket"?(data.basket-5)/5+1:data[k],mx=k=>k=="basket"?9:8,cost=k=>Math.round(B[k]*lv(k)*(1+lv(k)*.25));
function buy(k){const p=cost(k);if(lv(k)>=mx(k)||data.money<p)return say("Você não tem moedas suficientes!");data.money-=p;if(k=="basket")data.basket+=5;else data[k]++;save();updateUI();say("Melhoria adquirida com sucesso!");log("Melhoria comprada: "+UP.find(u=>u[0]==k)[2])}
function renderUp(){$("ups").innerHTML=UP.map(([k,e,n,d])=>{const l=lv(k),p=cost(k),M=l>=mx(k);return`<div class="upgrade"><div><strong>${e} ${n}</strong><small>${d}</small><small class="pips">${"■".repeat(l)}${"□".repeat(mx(k)-l)} Nv.${l}${k=="basket"?" • "+data.basket+" peixes":""}</small></div><button class="buy" ${M||data.money<p?"disabled":""} onclick="buy('${k}')">${M?"MÁXIMO":p+" 🪙"}</button></div>`}).join("")}
function renderBook(){
 const w=wts(),S=w.reduce((a,b)=>a+b),got=F.filter(f=>data.caught[f.id]).length;
 $("bkInfo").textContent=`Descobertos: ${got}/${F.length}. Quanto maior a dificuldade, menor a zona de captura.`;
 $("bk").innerHTML=F.map((f,i)=>{const n=data.caught[f.id]||0;return`<div class="fc" style="border-color:${n?RC[f.r]:"#344c72"}"><canvas width="64" height="40" data-i="${i}"></canvas><strong>${n?f.n:"???"}</strong><small style="color:${RC[f.r]}">${RN[f.r]}</small><small>${"★".repeat(f.d)}${"☆".repeat(5-f.d)}</small><small>🎲 ${(w[i]/S*100).toFixed(1)}%</small><small>${n?`🪙 ${val(f)} • ${n}x`:"Não descoberto"}</small></div>`}).join("");
 document.querySelectorAll("#bk canvas").forEach(k=>{const f=F[k.dataset.i];spr(k.getContext("2d"),2,0,f,4,false,!data.caught[f.id])})}
function tab(i){document.querySelectorAll(".tab").forEach((t,j)=>t.classList.toggle("on",i==j));document.querySelectorAll(".tp").forEach((t,j)=>t.classList.toggle("on",i==j));if(i==1)renderUp();if(i==2)renderBook()}
function updateUI(){$("money").textContent=data.money;$("total").textContent=data.total;$("rodLevel").textContent="Nível "+data.rod;$("sellBtn").disabled=!data.bag.length;renderUp();if($("t2").classList.contains("on"))renderBook()}

// ===== peixes decorativos =====
const swim=[...Array(9)].map((_,i)=>({f:F[i*3%14],x:rnd(0,W),y:172+rnd(0,110),v:(i%2?1:-1)*rnd(10,28)}));

// ===== atualização =====
function update(dt){
 time+=dt;T+=dt;hopT=Math.max(0,hopT-dt);hopY=hopT>0?Math.abs(Math.sin(hopT*12))*7:0;
 let tA=0,a=-.6,bd=2;
 if(st=="casting"){const t=cl(T/.9,0,1);a=t<.3?lerp(-.6,-2.2,t/.3):lerp(-2.2,-.15,(t-.3)/.7);tA=.3;if(T>=.9){go("waiting");wait=rnd(2.5,5.5)*Math.max(.35,1-(data.rod-1)*.06-(data.bait-1)*.07);say("Aguardando um peixe morder a isca...")}}
 else if(st=="waiting"){a=-.6+Math.sin(time*2)*.02;if(T>wait){tgt=pick();go("bite");say("❗ UM PEIXE MORDEU! CLIQUE PARA FISGAR!");burst(bob.x,bob.y,"#fff0a0",8)}}
 else if(st=="bite"){a=-.45+Math.sin(time*40)*.06;bd=6;tA=.15;if(T>Math.max(.7,1.7-tgt.d*.1)){go("idle");say("O peixe escapou! Seja mais rápido.")}}
 else if(st=="reel"){a=-.95+Math.sin(T*35)*.05;bd=12+Math.sin(T*30)*3;tA=.45;m=.5+.5*Math.sin(T*sp);if(T>7)fail()}
 else if(st=="pull"){const t=cl(T/1.1,0,1);a=lerp(-.95,-1.6,t);bd=14*(1-t)+3;tA=1;if(T>=1.1)done()}
 else if(st=="caught"){a=lerp(-1.4,-.6,cl(T/1.2,0,1));tA=1-cl(T/1.2,0,1)*.9;if(T>4.5)go("idle")}
 armUp+=(tA-armUp)*Math.min(1,dt*9);ang=a;bend=bd;
 hand={x:254,y:126-armUp*22-hopY};tip={x:hand.x+Math.cos(ang)*54,y:hand.y+Math.sin(ang)*54};
 if(st=="casting"){const p=cl((T/.9-.4)/.6,0,1);bob.x=lerp(tip.x,340,p);bob.y=lerp(tip.y,212,p)-Math.sin(Math.PI*p)*55}
 else if(st=="waiting"||st=="bite"||st=="reel"){bob.x=340+(st=="reel"?Math.sin(T*28)*4:0);bob.y=212+(st=="bite"?4+Math.sin(time*30)*2:Math.sin(time*3)*1.5)}
 else if(st=="pull"){const p=cl(T/1.1,0,1);bob.x=lerp(b0.x,hand.x+6,p);bob.y=lerp(b0.y,hand.y-40,p)-Math.sin(Math.PI*p)*50}
 for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.l-=dt}P=P.filter(p=>p.l>0);
 for(const f of FL){f.y-=18*dt;f.l-=dt}FL=FL.filter(f=>f.l>0);
 for(const s of swim){s.x+=s.v*dt;if(s.x>W+30)s.x=-30;if(s.x<-30)s.x=W+30}
}

// ===== desenho =====
function tree(x,g){R(x,106,5,28,"#6b4a2a");R(x-11,88,27,22,g);R(x-7,78,19,12,g);R(x-14,98,33,8,g)}
function draw(){
 const ph=(.22+time/150)%1,d=.5+.5*Math.sin(ph*6.2832);
 const top=mix("#070c22","#3f9fe6",d);let bot=mix("#2a2a5a","#bdf2ff",d);bot=mix(bot,"#ff9a5a",Math.max(0,1-Math.abs(d-.45)*6)*.7);
 for(let y=0;y<136;y+=4)R(0,y,W,4,mix(top,bot,y/136));
 if(d<.55)for(let i=0;i<30;i++){c.globalAlpha=(.55-d)*1.6*(.6+.4*Math.sin(time*2+i));R(i*97%W,i*53%90,2,2,"#fff")}c.globalAlpha=1;
 const a=(ph-.25)*6.2832,sx=240+Math.sin(a)*215,sy=150-Math.cos(a)*130,mxp=240-Math.sin(a)*215,myp=150+Math.cos(a)*130;
 if(sy<134){c.globalAlpha=.25;R(sx-20,sy-20,40,40,"#ffe477");c.globalAlpha=1;R(sx-12,sy-16,24,32,"#ffe477");R(sx-16,sy-12,32,24,"#ffe477")}
 if(myp<134){R(mxp-10,myp-10,20,20,"#e8f0ff");R(mxp-4,myp-3,4,4,"#c0cce0");R(mxp+2,myp+3,3,3,"#c0cce0")}
 for(let i=0;i<5;i++){const x=(i*130+time*(5+i*2))%(W+90)-60,y=16+i*15,k=mix("#4a5280","#ffffff",d);R(x,y,50,12,k);R(x+12,y-9,26,10,k)}
 const mc=mix("#2a3566","#6b95b8",d),mc2=mix("#243a56","#4d7f8a",d);
 for(let x=0;x<W;x+=4)R(x,128-(24+34*Math.abs(Math.sin(x*.012+1))|0),4,70,mc);
 for(let x=0;x<W;x+=4)R(x,128-(8+24*Math.abs(Math.sin(x*.021+3))|0),4,40,mc2);
 if(d>.4)for(let i=0;i<2;i++){const x=(time*22+i*210)%(W+40)-20,y=45+i*16+Math.sin(time*3+i)*4,fl=Math.sin(time*9+i)>0?-2:0;R(x,y,2,2,"#2a3350");R(x-3,y+fl,3,2,"#2a3350");R(x+2,y+fl,3,2,"#2a3350")}
 tree(34,"#2f7a47");tree(88,"#3a8c52");tree(400,"#2f7a47");tree(452,"#3a8c52");
