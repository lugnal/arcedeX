<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift City</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--ink:#f1efe9;--dim:#9aa0aa;--hot:#ff5a3c;--gold:#ffc83d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(98vw,calc((100vh - 16px)*1.6));aspect-ratio:8/5;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px #2a2e36,0 20px 60px #000a;background:#000;font-size:clamp(11px,1.7vw,17px)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;display:none}
.playing .hud{display:block}
.hud>*{position:absolute}
#back{left:2%;top:3%;pointer-events:auto}
button{font:inherit;font-weight:700;color:var(--ink);background:#0008;border:2px solid #fff4;border-radius:10px;padding:.5em 1em;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--gold);outline:none}
button.main{background:var(--hot);border-color:var(--hot);font-size:1.4em;padding:.6em 2em}
#tot{right:2%;top:3%;text-align:right;line-height:1.2}
#tot b{font-size:2.2em;display:block;color:var(--gold)}
#tot span{color:var(--dim)}
#cur{left:50%;top:3%;transform:translateX(-50%);text-align:center;min-width:12em;opacity:0;transition:opacity .2s}
#cur.on{opacity:1}
#cur b{font-size:2.6em;display:block;line-height:1;text-shadow:0 2px 8px #000}
#cur span{display:inline-block;background:var(--hot);border-radius:6px;padding:.1em .6em;font-weight:800}
#spd{left:2%;bottom:3%;font-size:1.8em;font-weight:800;text-shadow:0 2px 6px #000}
#spd small{font-size:.5em;color:var(--dim)}
#tip{right:2%;bottom:3%;color:#fffa;text-align:right;font-size:.8em;text-shadow:0 1px 4px #000}
#pop{left:50%;top:38%;transform:translateX(-50%);font-size:2em;font-weight:900;text-shadow:0 3px 10px #000;white-space:nowrap;opacity:0}
#pop.show{animation:pop 1.3s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;text-align:center;background:radial-gradient(ellipse at center,#14161acc,#14161af5)}
.playing #menu{display:none}
#menu h1{margin:0;font-size:4.2em;font-style:italic;letter-spacing:-.03em;line-height:.9;transform:skewX(-8deg)}
#menu h1 em{color:var(--hot)}
#menu p{margin:0;color:var(--dim);max-width:30em;line-height:1.5}
.keys{display:flex;gap:1.5em;flex-wrap:wrap;justify-content:center;color:var(--ink)}
kbd{background:var(--panel);border:1px solid #fff3;border-bottom-width:3px;border-radius:5px;padding:.1em .5em;font-family:inherit;font-weight:700}
.touch{position:absolute;inset:auto 0 2% 0;display:none;justify-content:space-between;padding:0 2%;pointer-events:none}
.touch div{display:flex;gap:.6em;pointer-events:auto}
.touch button{width:3.6em;height:3.6em;padding:0;touch-action:none;user-select:none}
@media (pointer:coarse){.playing .touch{display:flex}#tip{display:none}}
@media (prefers-reduced-motion:reduce){#pop.show{animation-duration:.01s}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <button id="back" aria-label="Voltar ao início">← Voltar</button>
    <div id="tot"><span>Pontos</span><b id="tv">0</b><span>Recorde <span id="bv">0</span></span></div>
    <div id="cur"><b id="cv">0</b><span id="cm">x1</span></div>
    <div id="pop"></div>
    <div id="spd"><span id="sv">0</span> <small>km/h</small></div>
    <div id="tip">Setas/WASD dirigem · Espaço: freio de mão · R: reiniciar</div>
  </div>
  <div class="touch">
    <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div><button data-k="hb">⟲</button><button data-k="down">▼</button><button data-k="up">▲</button></div>
  </div>
  <div id="menu">
    <h1>DRIFT<br><em>CITY</em></h1>
    <p>Derrape pelas ruas, desvie de prédios, casas, carros e cones. Quanto mais longo e mais lateral o drift, mais pontos. Bata e perde o combo.</p>
    <div class="keys"><span><kbd>W</kbd> <kbd>↑</kbd> acelera</span><span><kbd>A</kbd><kbd>D</kbd> vira</span><span><kbd>S</kbd> freia/ré</span><span><kbd>Espaço</kbd> freio de mão</span></div>
    <div>Recorde: <b id="mb">0</b></div>
    <button class="main" id="play">Jogar</button>
    <button onclick="window.location.href='index.html'">Voltar</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),VW=960,VH=600;cv.width=VW;cv.height=VH;
const $=id=>document.getElementById(id),stage=$('stage');
let seed=11;const rnd=()=>(seed=seed*16807%2147483647,(seed-1)/2147483646);
const N=8,C=440,R=170,B=C-R,W=N*C+R;
const obs=[],cones=[],parks=[];
const pal=['#6d7b8d','#8b6f5c','#5f7d95','#a0826d','#7c6f9b','#5e8b7e','#b08968','#4f6d7a'];
const carCol=['#d94f4f','#4f8fd9','#e0c13f','#f0f0f0','#59b36b','#9a5fd1','#e08a3c'];
const pick=a=>a[Math.floor(rnd()*a.length)];
const ob=(x,y,w,h,t,c)=>obs.push({x,y,w,h,t,c});
// ---- mapa ----
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const bx=i*C+R,by=j*C+R,r=rnd();
  if(r<.4){
    if(rnd()<.35)ob(bx+12,by+12,B-24,B-24,'b',pick(pal));
    else{const w=(B-36)/2;for(let a=0;a<2;a++)for(let b=0;b<2;b++)ob(bx+12+a*(w+12),by+12+b*(w+12),w,w,'b',pick(pal))}
  }else if(r<.8){
    for(let a=0;a<3;a++)for(let b=0;b<3;b++)if(rnd()>.15)ob(bx+15+a*85,by+15+b*85,70,70,'h',pick(['#c4694f','#b5523b','#8f5a44','#6b7f9b','#a39a5c']));
  }else{
    parks.push([bx,by]);
    for(let k=0;k<8;k++)ob(bx+20+rnd()*(B-66),by+20+rnd()*(B-66),26,26,'t');
  }
}
function seg(hz,line,s){
  const a=s*C+R,m=line*C+R/2;
  const P=(u,v,l,w,t,c)=>hz?ob(a+u,line*C+v,l,w,t,c):ob(line*C+v,a+u,w,l,t,c);
  if(rnd()<.45)P(10+rnd()*(B-100),6,70,34,'c',pick(carCol));
  if(rnd()<.45)P(10+rnd()*(B-100),R-40,70,34,'c',pick(carCol));
  if(rnd()<.12)P(B/2-35,R/2-17,70,34,'c',pick(carCol));
  if(rnd()<.35){const o=(rnd()-.5)*60;for(let k=0;k<6;k++){const u=30+k*35;cones.push({x:hz?a+u:m+o,y:hz?m+o:a+u,vx:0,vy:0})}}
}
for(let l=0;l<=N;l++)for(let s=0;s<N;s++){seg(true,l,s);seg(false,l,s)}
const SX=4*C+R/2,SY=4*C+R/2;
for(let k=0;k<6;k++)cones.push({x:SX+200+k*70,y:SY+(k%2?34:-34),vx:0,vy:0});
// ---- estado ----
const inp={up:0,down:0,left:0,right:0,hb:0};
let car,drift,total,best=0,mode='menu',skids=[],sh=0,cool=0,cam={x:SX,y:SY,z:.9},parts=[],lastSk=[null,null],sk=0;
try{best=+localStorage.getItem('drift-best')||0}catch(e){}
function reset(){car={x:SX,y:SY,a:0,vx:0,vy:0,st:0};drift={cur:0,t:0,mult:1,grace:0};total=0;skids=[];parts=[];sh=0;lastSk=[null,null];
  cones.forEach(c=>{c.vx=c.vy=0});say('');updBest()}
function updBest(){$('bv').textContent=best;$('mb').textContent=best}
function say(t,col){const p=$('pop');p.textContent=t;p.style.color=col||'#fff';p.classList.remove('show');void p.offsetWidth;if(t)p.classList.add('show')}
function bank(){if(drift.cur>=1){const n=Math.round(drift.cur);total+=n;say('+'+n+' DRIFT x'+drift.mult,'#ffc83d');
  if(total>best){best=total;try{localStorage.setItem('drift-best',best)}catch(e){}updBest()}}
  drift.cur=0;drift.t=0;drift.mult=1;drift.grace=0}
function crash(imp){if(drift.cur>1)say('BATEU! combo perdido','#ff5a3c');drift.cur=0;drift.t=0;drift.mult=1;drift.grace=0;sh=Math.min(14,imp/25)}
// ---- física ----
const offs=[-19,0,19],CR=14;
function update(dt){
  const s=(inp.right?1:0)-(inp.left?1:0);
  const fx=Math.cos(car.a),fy=Math.sin(car.a),rx=-fy,ry=fx;
  let vf=car.vx*fx+car.vy*fy,vl=car.vx*rx+car.vy*ry;
  const sp=Math.hypot(car.vx,car.vy);
  if(inp.up)vf+=560*dt*(1-Math.max(0,vf)/700);
  if(inp.down){vf-=(vf>20?1000:320)*dt;if(vf<-180)vf=-180}
  if(!inp.up&&!inp.down)vf*=Math.exp(-.9*dt);
  vf*=Math.exp(-.25*dt);
  if(inp.hb)vf*=Math.exp(-.8*dt);
  car.st+=(s-car.st)*Math.min(1,9*dt);
  const grip=inp.hb?.8:Math.max(1.4,4.6-2.6*Math.abs(car.st)*Math.min(1,Math.max(0,vf)/420)-(inp.up?.8:0)*Math.abs(car.st));
  vl*=Math.exp(-grip*dt);
  const dir=vf>=-20?1:-1;
  car.a+=car.st*2.7*Math.min(1,sp/160)*dir*dt;
  car.vx=fx*vf+rx*vl;car.vy=fy*vf+ry*vl;
  car.x+=car.vx*dt;car.y+=car.vy*dt;
  const drifting=sp>170&&Math.abs(vl)>85;
  collide(drifting);
  if(drifting){drift.t+=dt;drift.grace=.6;drift.mult=Math.min(8,1+Math.floor(drift.t/1.5));drift.cur+=Math.abs(vl)*sp/200*drift.mult*dt}
  else if(drift.cur>0){drift.grace-=dt;if(drift.grace<=0)bank()}
  cool-=dt;sh*=Math.exp(-6*dt);
  // marcas e fumaça
  const c2=Math.cos(car.a),s2=Math.sin(car.a);
  if(drifting||(inp.hb&&sp>120)){
    for(let w=0;w<2;w++){
      const lx=-17,ly=w?11:-11,wx=car.x+c2*lx-s2*ly,wy=car.y+s2*lx+c2*ly,l=lastSk[w];
      if(l){skids[sk++%3000]=[l[0],l[1],wx,wy]}
      lastSk[w]=[wx,wy];
      if(parts.length<120&&Math.random()<.7)parts.push({x:wx,y:wy,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,l:0,m:.8+Math.random()*.5,r:6})
    }
  }else lastSk=[null,null];
  for(const p of parts){p.l+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=22*dt}
  parts=parts.filter(p=>p.l<p.m);
  // cones
  for(const k of cones){k.x+=k.vx*dt;k.y+=k.vy*dt;const f=Math.exp(-3*dt);k.vx*=f;k.vy*=f}
  // HUD
  $('tv').textContent=Math.round(total);
  $('sv').textContent=Math.round(Math.hypot(car.vx,car.vy)*.2);
  const cu=$('cur');cu.classList.toggle('on',drift.cur>1);$('cv').textContent=Math.round(drift.cur);$('cm').textContent='x'+drift.mult;
}
function collide(drifting){
  const c=Math.cos(car.a),sn=Math.sin(car.a);
  for(let i=0;i<3;i++){
    const px=car.x+c*offs[i],py=car.y+sn*offs[i];
    for(const o of obs){
      if(px<o.x-40||px>o.x+o.w+40||py<o.y-40||py>o.y+o.h+40)continue;
      const cx=Math.max(o.x,Math.min(px,o.x+o.w)),cy=Math.max(o.y,Math.min(py,o.y+o.h));
      let dx=px-cx,dy=py-cy;const d=Math.hypot(dx,dy);
      if(d<CR){
        let nx,ny;
        if(d>.01){nx=dx/d;ny=dy/d}else{const v=Math.hypot(car.vx,car.vy)||1;nx=-car.vx/v;ny=-car.vy/v}
        const pen=CR-d;car.x+=nx*pen;car.y+=ny*pen;
        const vn=car.vx*nx+car.vy*ny;
        if(vn<0){car.vx-=1.35*vn*nx;car.vy-=1.35*vn*ny;car.vx*=.93;car.vy*=.93;if(-vn>70)crash(-vn)}
      }else if(i==1&&drifting&&d<CR+16&&cool<=0&&o.t!=='t'){
        cool=.6;const b=Math.round(120*drift.mult);drift.cur+=b;say('RASPÃO! +'+b,'#5fe0ff');
      }
    }
    for(const k of cones){
      const dx=k.x-px,dy=k.y-py,d=Math.hypot(dx,dy);
      if(d<CR+8&&d>.01){
        const sp=Math.hypot(car.vx,car.vy);
        k.vx=dx/d*(sp*.9+80);k.vy=dy/d*(sp*.9+80);
        car.vx*=.985;car.vy*=.985;
        if(k.hit!==true&&drift.cur>1){drift.cur*=.75;say('CONE! -25%','#ff9a3c')}
        k.hit=true;
      }else if(d>CR+30)k.hit=false;
    }
  }
  if(car.x<CR){car.x=CR;car.vx=Math.abs(car.vx)*.4;crash(100)}
  if(car.x>W-CR){car.x=W-CR;car.vx=-Math.abs(car.vx)*.4;crash(100)}
  if(car.y<CR){car.y=CR;car.vy=Math.abs(car.vy)*.4;crash(100)}
  if(car.y>W-CR){car.y=W-CR;car.vy=-Math.abs(car.vy)*.4;crash(100)}
}
// ---- desenho ----
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function render(){
  const sp=Math.hypot(car.vx,car.vy);
  cam.x+=(car.x+car.vx*.3-cam.x)*.1;cam.y+=(car.y+car.vy*.3-cam.y)*.1;
  cam.z+=((.92-Math.min(.2,sp/3000))-cam.z)*.05;
  const z=cam.z,hw=VW/2/z,hh=VH/2/z,x0=cam.x-hw-60,x1=cam.x+hw+60,y0=cam.y-hh-60,y1=cam.y+hh+60;
  const vis=(x,y,w,h)=>x<x1&&x+w>x0&&y<y1&&y+h>y0;
  g.fillStyle='#111';g.fillRect(0,0,VW,VH);
  g.save();g.translate(VW/2+(Math.random()-.5)*sh,VH/2+(Math.random()-.5)*sh);g.scale(z,z);g.translate(-cam.x,-cam.y);
  g.fillStyle='#50555e';g.fillRect(0,0,W,W);
  g.fillStyle='#2f5d3a';for(const p of parks)if(vis(p[0],p[1],B,B))g.fillRect(p[0],p[1],B,B);
  g.fillStyle='#24272c';
  for(let i=0;i<=N;i++){g.fillRect(i*C,0,R,W);g.fillRect(0,i*C,W,R)}
  g.strokeStyle='#d9b84a';g.lineWidth=3;g.setLineDash([24,20]);g.beginPath();
  for(let i=0;i<=N;i++){g.moveTo(i*C+R/2,0);g.lineTo(i*C+R/2,W);g.moveTo(0,i*C+R/2);g.lineTo(W,i*C+R/2)}
  g.stroke();g.setLineDash([]);g.fillStyle='#24272c';
  for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)if(vis(i*C,j*C,R,R))g.fillRect(i*C,j*C,R,R);
  // marcas de pneu
  g.strokeStyle='rgba(8,8,8,.5)';g.lineWidth=4;g.lineCap='round';g.beginPath();
  for(const s of skids){if(s&&s[0]>x0&&s[0]<x1&&s[1]>y0&&s[1]<y1){g.moveTo(s[0],s[1]);g.lineTo(s[2],s[3])}}
  g.stroke();
  // cones
  for(const k of cones){if(k.x<x0||k.x>x1||k.y<y0||k.y>y1)continue;
    g.fillStyle='#0005';g.beginPath();g.arc(k.x+3,k.y+3,8,0,7);g.fill();
    g.fillStyle='#ff7a1a';g.beginPath();g.arc(k.x,k.y,8,0,7);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(k.x,k.y,4.5,0,7);g.fill();
    g.fillStyle='#ff7a1a';g.beginPath();g.arc(k.x,k.y,2,0,7);g.fill()}
  // fumaça
  for(const p of parts){g.fillStyle='rgba(235,235,235,'+(.35*(1-p.l/p.m))+')';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
  // carro
  drawCar();
  // objetos
  for(const o of obs){if(!vis(o.x,o.y,o.w,o.h))continue;
    if(o.t==='t'){const cx=o.x+13,cy=o.y+13;g.fillStyle='#0005';g.beginPath();g.arc(cx+5,cy+5,19,0,7);g.fill();
      g.fillStyle='#1f4a2a';g.beginPath();g.arc(cx,cy,19,0,7);g.fill();g.fillStyle='#2e7a42';g.beginPath();g.arc(cx-3,cy-3,11,0,7);g.fill();continue}
    g.fillStyle='rgba(0,0,0,.35)';g.fillRect(o.x+10,o.y+10,o.w,o.h);
    if(o.t==='c'){g.fillStyle=o.c;rr(o.x,o.y,o.w,o.h,7);g.fill();g.fillStyle='#1b222b';
      if(o.w>o.h)rr(o.x+o.w*.28,o.y+5,o.w*.4,o.h-10,4);else rr(o.x+5,o.y+o.h*.28,o.w-10,o.h*.4,4);g.fill();continue}
    g.fillStyle=o.c;g.fillRect(o.x,o.y,o.w,o.h);
    if(o.t==='b'){g.fillStyle='rgba(255,255,255,.14)';g.fillRect(o.x+8,o.y+8,o.w-16,o.h-16);
      g.fillStyle='rgba(0,0,0,.25)';g.fillRect(o.x+o.w*.6,o.y+o.h*.15,o.w*.22,o.w*.22);g.fillRect(o.x+o.w*.15,o.y+o.h*.6,o.w*.22,o.w*.22);
      g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=2;g.strokeRect(o.x,o.y,o.w,o.h)}
    else{g.fillStyle='rgba(0,0,0,.22)';g.fillRect(o.x,o.y+o.h/2,o.w,o.h/2);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(o.x,o.y+o.h/2-2,o.w,4)}
  }
  g.restore();
}
function drawCar(){
  g.save();g.translate(car.x,car.y);g.rotate(car.a);
  g.fillStyle='rgba(0,0,0,.4)';rr(-25,-12,56,32,8);g.fill();
  g.fillStyle='#111';
  for(const [wx,wy,f] of [[-17,-14,0],[-17,9,0],[15,-14,1],[15,9,1]]){g.save();g.translate(wx+4,wy+2.5);if(f)g.rotate(car.st*.4);g.fillRect(-6,-2.5,12,5);g.restore()}
  g.fillStyle='#e8402f';rr(-27,-14,54,28,8);g.fill();
  g.fillStyle='#fff';g.fillRect(-27,-3,54,2.5);g.fillRect(-27,1,54,2.5);
  g.fillStyle='#1b222b';rr(-9,-10,22,20,5);g.fill();
  g.fillStyle='#7fb7e8';rr(9,-9,6,18,3);g.fill();
  g.fillStyle='#ffe98a';g.fillRect(24,-12,3,6);g.fillRect(24,6,3,6);
  g.fillStyle=(inp.down||inp.hb)?'#ff2a2a':'#8a1f1f';g.fillRect(-27,-12,3,6);g.fillRect(-27,6,3,6);
  g.restore();
}
// ---- controle ----
const keymap={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'hb'};
addEventListener('keydown',e=>{
  if(mode==='play'){const k=keymap[e.key];if(k){inp[k]=1;e.preventDefault()}
    if(e.key==='r'||e.key==='R'){bank();reset()}
    if(e.key==='Escape')toMenu()}
  else if(e.key==='Enter')start()});
addEventListener('keyup',e=>{const k=keymap[e.key];if(k)inp[k]=0});
document.querySelectorAll('.touch button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();inp[k]=1});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>inp[k]=0))});
function start(){reset();mode='play';stage.classList.add('playing');cam.x=SX;cam.y=SY}
function toMenu(){bank();mode='menu';stage.classList.remove('playing');for(const k in inp)inp[k]=0}
$('play').onclick=start;$('back').onclick=toMenu;
addEventListener('blur',()=>{for(const k in inp)inp[k]=0});
// ---- loop ----
reset();let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;
  if(mode==='play')update(dt);else{cam.x=SX+Math.cos(t/4000)*300;cam.y=SY+Math.sin(t/4000)*300}
  render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
