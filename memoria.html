  <!DOCTYPE html>
  <html lang="pt-br">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória - ArcadeX</title>

  <style>
  body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #1b1b3a, #0a0a16);
    color: white;
    text-align: center;
  }

  h1 {
    color: #00e5ff;
    margin-top: 20px;
  }

  .info {
    margin: 10px;
    font-size: 18px;
  }

  .botoes {
    margin-top: 10px;
  }

  button {
    background: linear-gradient(90deg, #00e5ff, #8a2be2);
    border: none;
    color: white;
    padding: 10px 18px;
    margin: 5px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  button:hover {
    transform: scale(1.05);
  }

  .tabuleiro {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    gap: 15px;
    justify-content: center;
    margin-top: 30px;
  }

  .carta {
    width: 100px;
    height: 100px;
    background: #22223a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    cursor: pointer;
    border-radius: 12px;
    transition: 0.3s;
    user-select: none;
  }

  .carta:hover {
    transform: scale(1.05);
    box-shadow: 0 0 10px #00e5ff;
  }

  .virada {
    background: #00e5ff;
    color: black;
  }

  .mensagem {
    margin-top: 20px;
    font-size: 22px;
    color: #8a2be2;
  }
  </style>

  </head>
  <body>

  <h1>🧩 Jogo da Memória</h1>

  <div class="info">
    Tentativas: <span id="tentativas">0</span>
  </div>

  <div class="botoes">
    <button onclick="reiniciar()">🔄 Reiniciar</button>
    <button onclick="voltar()">Voltar ao Menu</button>
  </div>

  <div class="tabuleiro" id="tabuleiro"></div>

  <div class="mensagem" id="mensagem"></div>

  <script>
  const emojis = ["🐍","🎮","🧠","🔥","⚡","🚀","💀","👾"]
  let cartas = [];
  let primeira = null;
  let segunda = null;
  let travado = false;
  let tentativas = 0;

  const tabuleiro = document.getElementById("tabuleiro");
  const tentativasEl = document.getElementById("tentativas");
  const mensagem = document.getElementById("mensagem");

  function iniciarJogo() {
    tabuleiro.innerHTML = "";
    mensagem.textContent = "";
    tentativas = 0;
    tentativasEl.textContent = tentativas;

    cartas = [...emojis, ...emojis];
    cartas.sort(() => Math.random() - 0.5);

    cartas.forEach(emoji => {
      const div = document.createElement("div");
      div.classList.add("carta");
      div.dataset.valor = emoji;
      div.textContent = "❓";

      div.addEventListener("click", () => virarCarta(div));

      tabuleiro.appendChild(div);
    });
  }

  function virarCarta(carta) {
    if (travado || carta.classList.contains("virada")) return;

    carta.classList.add("virada");
    carta.textContent = carta.dataset.valor;

    if (!primeira) {
      primeira = carta;
      return;
    }

    segunda = carta;
    travado = true;

    tentativas++;
    tentativasEl.textContent = tentativas;

    verificar();
  }

  function verificar() {
    if (primeira.dataset.valor === segunda.dataset.valor) {
      primeira = null;
      segunda = null;
      travado = false;
      verificarFim();
    } else {
      setTimeout(() => {
        primeira.classList.remove("virada");
        segunda.classList.remove("virada");
        primeira.textContent = "❓";
        segunda.textContent = "❓";

        primeira = null;
        segunda = null;
        travado = false;
      }, 700);
    }
  }

  function verificarFim() {
    const todas = document.querySelectorAll(".carta");
    const venceu = [...todas].every(c => c.classList.contains("virada"));

    if (venceu) {
      mensagem.textContent = `🔥 Você venceu em ${tentativas} tentativas!`;
    }
  }

  function reiniciar() {
    primeira = null;
    segunda = null;
    travado = false;
    iniciarJogo();
  }

  function voltar() {
    window.location.href = "index.html";
  }

  iniciarJogo();
  </script>

  </body>
  </html>
