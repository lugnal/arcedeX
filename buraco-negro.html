<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buraco Negro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:'Courier New',monospace;text-align:center;user-select:none;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 8px}
h1{font-size:clamp(16px,4vw,22px);font-weight:700;letter-spacing:4px;color:#00e5ff;margin-bottom:8px;text-shadow:0 0 20px rgba(0,229,255,0.5)}
canvas{display:block;margin:0 auto;background:#000;border:1.5px solid #1a1a3a;border-radius:4px;cursor:none;max-width:100%}
.hud{display:flex;justify-content:center;gap:18px;font-size:12px;letter-spacing:1px;color:#555;padding:6px 0 5px;flex-wrap:wrap}
.hud b{color:#00e5ff}
.btns{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
button{padding:7px 18px;border:1px solid rgba(0,229,255,0.3);border-radius:20px;background:rgba(0,229,255,0.06);color:#00e5ff;cursor:pointer;font-size:11px;letter-spacing:1px;font-family:'Courier New',monospace;transition:all .2s}
button:hover{background:rgba(0,229,255,0.15);border-color:#00e5ff;box-shadow:0 0 12px rgba(0,229,255,0.2)}
p.hint{font-size:11px;color:#2a2a2a;margin-top:5px;letter-spacing:1px}
</style>
</head>
<body>

<h1>BURACO NEGRO</h1>

<div class="btns">
  <button onclick="startGame()">JOGAR</button>
  <button onclick="Voltar()">VOLTAR</button>
  <button onclick="togglePause()">PAUSAR</button>
</div>

<div class="hud">
  <span>PONTOS <b id="score">0</b></span>
  <span>COMBO <b id="combo">0x</b></span>
  <span>FASE <b id="wave">1</b></span>
  <span>RECORDE <b id="record">0</b></span>
</div>

<canvas id="game" width="420" height="420"></canvas>
<p class="hint">mova o mouse para controlar &nbsp;|&nbsp; toque no mobile</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 420, H = 420;

let bh, objects, particles, stars;
let score=0, combo=0, wave=1, record=0;
let running=false, paused=false, animId=null;
let lastSpawn=0, flashAlpha=0;

// ── difficulty config per wave ──────────────────
function cfg(){
  return {
    dangerChance:  Math.min(0.10 + wave*0.04, 0.45),
    bigChance:     0.20,
    dangerLife:    Math.max(180 - wave*25, 55),
    spawnRate:     Math.max(1200 - wave*150, 380),
    maxObj:        18 + wave*2,
    gravPull:      0.015 + wave*0.004,
    maxVel:        2 + wave*0.3
  };
}

// ── stars ───────────────────────────────────────
function mkStars(){
  stars = [];
  for(let i=0;i<120;i++)
    stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.2+0.2, a:Math.random()});
}

// ── start / reset ───────────────────────────────
function startGame(){
  if(animId) cancelAnimationFrame(animId);
  wave=1; score=0; combo=0;
  paused=false; running=true; flashAlpha=0; lastSpawn=0;
  bh = {x:210, y:210, size:22, tx:210, ty:210, rot:0};
  objects=[]; particles=[];
  mkStars();
  for(let i=0;i<10;i++) spawnObject();
  updateHUD();
  loop();
}

function togglePause(){ if(running) paused=!paused; }

// ── spawn ────────────────────────────────────────
function spawnObject(){
  const c = cfg();
  if(objects.length >= c.maxObj) return;
  const margin=30;
  const obj = {
    x: Math.random()*(W-margin*2)+margin,
    y: Math.random()*(H-margin*2)+margin,
    vx:(Math.random()-0.5)*0.6,
    vy:(Math.random()-0.5)*0.6
  };
  const r = Math.random();
  if(r < c.dangerChance){
    obj.type="danger"; obj.size=11;
    obj.maxLife=c.dangerLife; obj.life=c.dangerLife;
  } else if(r < c.dangerChance + c.bigChance){
    obj.type="big"; obj.size=10; obj.life=-1;
  } else {
    obj.type="normal"; obj.size=6; obj.life=-1;
  }
  objects.push(obj);
}

function Voltar(){window.location.href = 'index.html'}

function maybeSpawn(now){
  const c = cfg();
  if(objects.length < c.maxObj && now - lastSpawn > c.spawnRate){
    spawnObject(); lastSpawn=now;
  }
}

// ── particles ────────────────────────────────────
function spawnParticles(x, y, col){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, col});
  }
}

// ── HUD ──────────────────────────────────────────
function updateHUD(){
  document.getElementById("score").textContent = score;
  document.getElementById("combo").textContent  = combo+"x";
  document.getElementById("wave").textContent   = wave;
  if(score > record){
    record = score;
    document.getElementById("record").textContent = record;
  }
}

// ── wave clear ───────────────────────────────────
function checkWaveClear(){
  if(bh.size >= W*0.72){
    wave++;
    bh.size = 22;
    objects=[]; particles=[];
    score += wave*50;
    combo=0;
    updateHUD();
    flashAlpha=0.9;
    for(let i=0;i<12;i++) spawnObject();
  }
}

// ── draw black hole ──────────────────────────────
function drawBH(){
  ctx.save();
  ctx.translate(bh.x, bh.y);
  ctx.rotate(bh.rot);

  // accretion disk
  const diskR = bh.size*1.8;
  ctx.beginPath();
  ctx.ellipse(0, 0, diskR, diskR*0.35, 0, 0, Math.PI*2);
  const dg = ctx.createLinearGradient(-diskR, 0, diskR, 0);
  dg.addColorStop(0,   "rgba(138,43,226,0)");
  dg.addColorStop(0.4, "rgba(200,100,255,0.3)");
  dg.addColorStop(0.5, "rgba(255,200,100,0.5)");
  dg.addColorStop(0.6, "rgba(200,100,255,0.3)");
  dg.addColorStop(1,   "rgba(138,43,226,0)");
  ctx.fillStyle=dg; ctx.fill();

  // gravity rings
  for(let ring=3;ring>0;ring--){
    ctx.beginPath();
    ctx.arc(0, 0, bh.size + ring*18, 0, Math.PI*2);
    ctx.strokeStyle=`rgba(138,43,226,${0.04*ring})`;
    ctx.lineWidth=ring*2; ctx.stroke();
  }

  // core
  const g = ctx.createRadialGradient(0,0, bh.size*0.1, 0,0, bh.size);
  g.addColorStop(0,   "#000");
  g.addColorStop(0.7, "#1a0033");
  g.addColorStop(1,   "#4a0080");
  ctx.beginPath(); ctx.arc(0,0,bh.size,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();

  ctx.restore();
}

// ── main loop ────────────────────────────────────
function loop(){
  if(!running){ animId=null; return; }
  animId = requestAnimationFrame(loop);

  if(paused){
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.font="bold 24px 'Courier New'"; ctx.fillStyle="#00e5ff";
    ctx.fillText("PAUSADO", W/2, H/2); ctx.textAlign="left";
    return;
  }

  const now = performance.now();
  ctx.clearRect(0,0,W,H);

  // background
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);

  // stars
  stars.forEach(s=>{
    ctx.globalAlpha=s.a*0.7;
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // move BH smoothly
  bh.x += (bh.tx - bh.x)*0.10;
  bh.y += (bh.ty - bh.y)*0.10;
  bh.rot += 0.04;

  // passive growth
  bh.size += cfg().fillRate !== undefined ? 0.006 : 0.006;

  // objects
  maybeSpawn(now);
  const c = cfg();
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];

    // drift & wrap
    o.x+=o.vx; o.y+=o.vy;
    if(o.x<-20) o.x=W+10; if(o.x>W+20) o.x=-10;
    if(o.y<-20) o.y=H+10; if(o.y>H+20) o.y=-10;

    // danger timer
    if(o.type==="danger" && o.life>0){
      o.life--;
      if(o.life<=0){ objects.splice(i,1); continue; }
    }

    // gravity pull
    const dx=bh.x-o.x, dy=bh.y-o.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    o.vx += (dx/dist)*c.gravPull;
    o.vy += (dy/dist)*c.gravPull;
    const spd=Math.sqrt(o.vx*o.vx+o.vy*o.vy);
    if(spd>c.maxVel){o.vx=o.vx/spd*c.maxVel; o.vy=o.vy/spd*c.maxVel;}

    // draw object
    const lifeRatio = o.type==="danger" && o.maxLife ? o.life/o.maxLife : 1;
    ctx.globalAlpha = o.type==="danger" ? Math.max(0.25, lifeRatio) : 1;

    if(o.type==="danger"){
      const pulse = 0.6 + 0.4*Math.sin(now*0.01+i);
      ctx.shadowColor="#ff0044"; ctx.shadowBlur=8*pulse;
      ctx.fillStyle=`hsl(${350+lifeRatio*10},100%,${45+20*(1-lifeRatio)}%)`;
      ctx.beginPath(); ctx.arc(o.x,o.y,o.size,0,Math.PI*2); ctx.fill();
      // countdown ring
      ctx.beginPath();
      ctx.arc(o.x,o.y,o.size+3,-Math.PI/2,-Math.PI/2+Math.PI*2*lifeRatio);
      ctx.strokeStyle=`rgba(255,60,60,${lifeRatio*0.8})`;
      ctx.lineWidth=2; ctx.stroke();
      ctx.shadowBlur=0;
    } else if(o.type==="big"){
      ctx.shadowColor="#ff9900"; ctx.shadowBlur=10;
      ctx.fillStyle="#ff9900";
      ctx.beginPath(); ctx.arc(o.x,o.y,o.size,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    } else {
      ctx.shadowColor="#00e5ff"; ctx.shadowBlur=6;
      ctx.fillStyle="#00e5ff";
      ctx.beginPath(); ctx.arc(o.x,o.y,o.size,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;

    // collision with BH
    if(dist < bh.size + o.size*0.6){
      if(o.type==="danger"){
        bh.size = Math.max(8, bh.size-5);
        combo=0;
        spawnParticles(o.x,o.y,"#ff3333");
      } else {
        const gain = o.type==="big" ? 3 : 1;
        score += gain*(combo+1);
        combo++;
        bh.size += 0.5*gain;
        spawnParticles(o.x,o.y, o.type==="big"?"#ff9900":"#00e5ff");
      }
      objects.splice(i,1);
      updateHUD();
    }
  }

  drawBH();

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.03;
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5*p.life,0,Math.PI*2); ctx.fill();
    if(p.life<=0) particles.splice(i,1);
  }
  ctx.globalAlpha=1;

  // wave flash
  if(flashAlpha>0){
    ctx.fillStyle=`rgba(0,229,255,${flashAlpha*0.2})`;
    ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.font=`bold ${Math.round(28+flashAlpha*8)}px 'Courier New'`;
    ctx.fillStyle=`rgba(0,229,255,${flashAlpha})`;
    ctx.shadowColor="#00e5ff"; ctx.shadowBlur=20*flashAlpha;
    ctx.fillText(`FASE ${wave}`, W/2, H/2);
    ctx.shadowBlur=0; ctx.textAlign="left";
    flashAlpha = Math.max(0, flashAlpha-0.016);
  }

  // progress bar
  const barW=W-40, barH=5, barX=20, barY=H-10;
  const pct=Math.min((bh.size-22)/(W*0.72-22),1);
  ctx.fillStyle="rgba(255,255,255,0.06)";
  ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle=`hsl(${Math.round(180+pct*120)},100%,55%)`;
  ctx.fillRect(barX,barY,barW*pct,barH);
  ctx.fillStyle="rgba(255,255,255,0.2)";
  ctx.font="9px 'Courier New'"; ctx.textAlign="right";
  ctx.fillText("tamanho", W-20, barY-2); ctx.textAlign="left";

  checkWaveClear();
  if(bh.size<=6) gameOver();
}

// ── game over ────────────────────────────────────
function gameOver(){
  running=false;
  ctx.fillStyle="rgba(0,0,0,0.82)"; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.font="bold 30px 'Courier New'"; ctx.fillStyle="#ff3344";
  ctx.shadowColor="#ff0033"; ctx.shadowBlur=20;
  ctx.fillText("FIM DE JOGO", W/2, H/2-22);
  ctx.shadowBlur=0;
  ctx.font="14px 'Courier New'"; ctx.fillStyle="#888";
  ctx.fillText(`Pontos: ${score}   Fase: ${wave}`, W/2, H/2+14);
  ctx.font="11px 'Courier New'"; ctx.fillStyle="#444";
  ctx.fillText("clique em JOGAR para tentar novamente", W/2, H/2+40);
  ctx.textAlign="left";
}

// ── input ────────────────────────────────────────
canvas.addEventListener("mousemove", e=>{
  const r=canvas.getBoundingClientRect();
  const sx=W/r.width, sy=H/r.height;
  if(bh){ bh.tx=(e.clientX-r.left)*sx; bh.ty=(e.clientY-r.top)*sy; }
});

canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const sx=W/r.width, sy=H/r.height;
  if(bh){ bh.tx=(e.touches[0].clientX-r.left)*sx; bh.ty=(e.touches[0].clientY-r.top)*sy; }
},{passive:false});

// ── idle screen ───────────────────────────────────
(function idleScreen(){
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){
    ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.5})`;
    ctx.beginPath(); ctx.arc(Math.random()*W,Math.random()*H,Math.random()*1.2,0,Math.PI*2); ctx.fill();
  }
  ctx.textAlign="center";
  ctx.font="bold 20px 'Courier New'"; ctx.fillStyle="#00e5ff";
  ctx.shadowColor="#00e5ff"; ctx.shadowBlur=12;
  ctx.fillText("BURACO NEGRO", W/2, H/2-10);
  ctx.shadowBlur=0;
  ctx.font="12px 'Courier New'"; ctx.fillStyle="#333";
  ctx.fillText("clique em JOGAR para começar", W/2, H/2+18);
  ctx.textAlign="left";
})();
</script>
</body>
</html>
