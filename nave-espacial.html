<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nave Espacial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cyan:#00e5ff;--blue:#3a8fff;--red:#ff4466;--amber:#ff9500;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08)}
body{background:#050510;color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 8px;user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 30%,rgba(58,143,255,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 60% at 80% 70%,rgba(170,34,255,0.06) 0%,transparent 70%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
#header{display:flex;align-items:center;gap:16px}
#header h1{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;letter-spacing:.12em;background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
#hud{display:flex;background:var(--surface);border:.5px solid var(--border);border-radius:8px;overflow:hidden;width:480px}
.hud-item{flex:1;padding:7px 14px;border-right:.5px solid var(--border);display:flex;flex-direction:column;gap:2px}
.hud-item:last-child{border-right:none}
.hud-label{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35)}
.hud-value{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--cyan)}
#lives-val{color:var(--red)}#level-val{color:var(--amber)}
#canvas-wrap{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 .5px var(--border),0 0 40px rgba(0,229,255,.08)}
canvas{display:block;background:#08091a}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(5,5,20,.88);backdrop-filter:blur(4px)}
#overlay.hidden{display:none}
.overlay-title{font-family:'Orbitron',monospace;font-size:26px;font-weight:900;letter-spacing:.08em;text-align:center;line-height:1.2}
.overlay-title.start-title{background:linear-gradient(135deg,#00e5ff,#3a8fff,#aa22ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.overlay-title.gameover-title{color:var(--red)}
.overlay-score{font-size:14px;color:rgba(255,255,255,.5);letter-spacing:.05em}
.overlay-score span{color:var(--cyan);font-weight:600}
.ctrl-row{display:flex;gap:8px;align-items:center;font-size:12px;color:rgba(255,255,255,.4)}
.key{background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.15);border-radius:4px;padding:2px 8px;font-family:'Orbitron',monospace;font-size:11px;color:rgba(255,255,255,.7)}
#start-btn{padding:11px 38px;background:transparent;border:1px solid var(--cyan);border-radius:6px;color:var(--cyan);font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:.12em;cursor:pointer;transition:background .2s,box-shadow .2s,transform .1s}
#start-btn:hover{background:rgba(0,229,255,.1);box-shadow:0 0 20px rgba(0,229,255,.2)}
#start-btn:active{transform:scale(.97)}
#legend{display:flex;gap:18px;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.04em}
.ld{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<div id="app">
  <div id="header"><div class="dot"></div><h1>NAVE ESPACIAL</h1><div class="dot"></div></div>
  <div id="hud">
    <div class="hud-item"><div class="hud-label">Pontos</div><div class="hud-value" id="score-val">0</div></div>
    <div class="hud-item"><div class="hud-label">Nível</div><div class="hud-value" id="level-val">1</div></div>
    <div class="hud-item"><div class="hud-label">Vidas</div><div class="hud-value" id="lives-val">♥ ♥ ♥</div></div>
    <div class="hud-item"><div class="hud-label">High Score</div><div class="hud-value" id="hi-val">0</div></div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c" width="480" height="520"></canvas>
    <div id="overlay">
      <div class="overlay-title start-title">NAVE<br>ESPACIAL</div>
      <div class="ctrl-row"><span class="key">←→↑↓</span> / <span class="key">WASD</span> mover &nbsp; <span class="key">ESPAÇO</span> atirar</div>
      <button id="start-btn">INICIAR</button>
      <button onclick="Voltar()" id="start-btn"">VOLTAR</button>
    </div>
  </div>
  <div id="legend">
    <span><span class="ld" style="background:#ff4466"></span>Scout · 10pts</span>
    <span><span class="ld" style="background:#aa22ff"></span>Fighter · 20pts</span>
    <span><span class="ld" style="background:#44cc88"></span>Tank · 30pts</span>
  </div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const overlay=document.getElementById('overlay'),overlayTitle=overlay.querySelector('.overlay-title');
const startBtn=document.getElementById('start-btn');
const scoreEl=document.getElementById('score-val'),levelEl=document.getElementById('level-val');
const livesEl=document.getElementById('lives-val'),hiEl=document.getElementById('hi-val');
let highScore=0,lastShootTime=0;
const SHOOT_CD=160,keys={};

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();tryShoot();}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

let player,bullets,enemies,particles,stars,score,lives,level,running,frameCount,lastTime;

function initStars(){
  stars=[];
  for(let i=0;i<100;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,spd:Math.random()*.7+.15,o:Math.random()*.5+.2});
}

function start(){
  player={x:W/2-18,y:H-80,w:36,h:48,speed:4.8,inv:0};
  bullets=[];enemies=[];particles=[];
  score=0;lives=3;level=1;frameCount=0;lastShootTime=0;
  scoreEl.textContent=0;levelEl.textContent=1;
  livesEl.textContent='♥ ♥ ♥';
  overlay.classList.add('hidden');
  running=true;lastTime=performance.now();
  requestAnimationFrame(loop);
}

function Voltar() {
  window.location.href = "index.html"
}

function loop(ts){
  if(!running) return;
  const dt=Math.min((ts-lastTime)/16.667,3);lastTime=ts;frameCount++;
  const nl=1+Math.floor(score/200);
  if(nl!==level){level=nl;levelEl.textContent=level;}
  ctx.fillStyle='#08091a';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.y+=s.spd*dt;if(s.y>H){s.y=-2;s.x=Math.random()*W;}ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+s.o+')';ctx.fill();});
  const sp=player.speed*dt;
  if(keys['ArrowLeft']||keys['a']||keys['A']) player.x=Math.max(0,player.x-sp);
  if(keys['ArrowRight']||keys['d']||keys['D']) player.x=Math.min(W-player.w,player.x+sp);
  if(keys['ArrowUp']||keys['w']||keys['W']) player.y=Math.max(H*.4,player.y-sp);
  if(keys['ArrowDown']||keys['s']||keys['S']) player.y=Math.min(H-player.h-4,player.y+sp);
  if(player.inv>0) player.inv-=dt;
  if(keys[' ']) tryShoot();
  bullets=bullets.filter(b=>b.y>-20);
  bullets.forEach(b=>{
    b.y-=8.5*dt;
    const g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+16);
    g.addColorStop(0,'#fff');g.addColorStop(.3,'#aaeeff');g.addColorStop(1,'rgba(0,200,255,0)');
    ctx.save();ctx.shadowColor='#00e5ff';ctx.shadowBlur=5;ctx.fillStyle=g;ctx.fillRect(b.x,b.y,4,16);ctx.restore();
  });
  const rate=Math.max(.006,.024-level*.0018);
  if(Math.random()<rate){
    const r=Math.random(),type=r<.28?'tank':r<.55?'fighter':'scout';
    enemies.push({x:Math.random()*(W-44)+2,y:-52,w:40,h:40,
      speed:(1.5+Math.random()*1.5+level*.12)*(type==='scout'?1.6:type==='tank'?.65:1),
      type,hp:type==='tank'?3:type==='fighter'?2:1,maxHp:type==='tank'?3:type==='fighter'?2:1,
      wob:Math.random()*Math.PI*2,wobSpd:(Math.random()-.5)*.09,flash:0});
  }
  const rem=new Set();
  enemies.forEach((e,i)=>{
    e.y+=e.speed*dt;e.wob+=e.wobSpd*dt;
    e.x+=Math.sin(e.wob)*.9;e.x=Math.max(2,Math.min(W-e.w-2,e.x));
    if(e.flash>0) e.flash-=dt;
    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];
      if(b.x+4>e.x&&b.x<e.x+e.w&&b.y<e.y+e.h&&b.y+16>e.y){
        e.hp--;e.flash=4;bullets.splice(bi,1);
        if(e.hp<=0){explode(e.x+e.w/2,e.y+e.h/2,e.type);const pts=e.type==='tank'?30:e.type==='fighter'?20:10;score+=pts;if(score>highScore){highScore=score;hiEl.textContent=highScore;}scoreEl.textContent=score;rem.add(i);}
        break;
      }
    }
    if(!rem.has(i)&&player.inv<=0){
      if(e.x<player.x+player.w-6&&e.x+e.w-6>player.x&&e.y<player.y+player.h&&e.y+e.h-4>player.y){
        explode(e.x+e.w/2,e.y+e.h/2,e.type);rem.add(i);lives--;
        livesEl.textContent=lives>0?Array(lives).fill('♥').join(' '):'—';
        player.inv=140;if(lives<=0){gameOver();return;}
      }
    }
    if(e.y>H+60) rem.add(i);
    if(!rem.has(i)) drawEnemy(e);
  });
  enemies=enemies.filter((_,i)=>!rem.has(i));
  drawRocket(player.x,player.y,player.w,player.h,player.inv>0);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.life-=.022*dt;
    if(p.ring){p.r+=2.5*dt;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.strokeStyle=p.col+Math.floor(p.life*255).toString(16).padStart(2,'0');ctx.lineWidth=1.5;ctx.stroke();}
    else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.05*dt;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.1,p.r*p.life),0,Math.PI*2);ctx.fillStyle=p.col+Math.floor(p.life*200).toString(16).padStart(2,'0');ctx.fill();}
  });
  requestAnimationFrame(loop);
}

function tryShoot(){
  if(!running||!player) return;
  const now=performance.now();
  if(now-lastShootTime<SHOOT_CD) return;
  lastShootTime=now;
  const cx=player.x+player.w/2;
  bullets.push({x:cx-2,y:player.y+6});
  for(let i=0;i<3;i++) particles.push({x:cx+(Math.random()-.5)*5,y:player.y+6,vx:(Math.random()-.5)*1.5,vy:-Math.random()*2,life:.4,r:1.5,col:'#80e8ff',ring:false});
}

function explode(x,y,type){
  const pal={scout:['#ff8844','#ffcc44','#ff4422','#fff'],fighter:['#cc44ff','#ff88cc','#8844ff','#fff'],tank:['#44ffaa','#fff','#44cc66','#aaffcc']};
  const cols=pal[type];
  for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,s=Math.random()*4+.5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.9+Math.random()*.4,r:Math.random()*3+1,col:cols[Math.floor(Math.random()*cols.length)],ring:false});}
  particles.push({x,y,vx:0,vy:0,life:.6,r:0,col:type==='tank'?'#44ffaa':type==='fighter'?'#cc44ff':'#ff8844',ring:true});
}

function drawRocket(x,y,w,h,blink){
  const cx=x+w/2;
  if(blink&&Math.floor(frameCount/5)%2===0) return;
  ctx.save();
  const eg=ctx.createRadialGradient(cx,y+h+5,0,cx,y+h+5,16);
  eg.addColorStop(0,'rgba(60,160,255,.5)');eg.addColorStop(1,'rgba(60,160,255,0)');
  ctx.fillStyle=eg;ctx.beginPath();ctx.ellipse(cx,y+h+5,16,10,0,0,Math.PI*2);ctx.fill();
  const t=frameCount;
  [{ox:-8,sc:.85},{ox:0,sc:1},{ox:8,sc:.85}].forEach(f=>{
    const fx=cx+f.ox,fh=(10+Math.sin(t*.35+f.ox)*3)*f.sc;
    const fg=ctx.createLinearGradient(fx,y+h,fx,y+h+fh+4);
    fg.addColorStop(0,f.ox===0?'#80e8ff':'#4ab0ff');fg.addColorStop(.4,'#ffaa00');fg.addColorStop(1,'rgba(255,50,0,0)');
    ctx.beginPath();ctx.moveTo(fx-3.5*f.sc,y+h);ctx.quadraticCurveTo(fx,y+h+fh+5,fx+3.5*f.sc,y+h);ctx.fillStyle=fg;ctx.fill();
  });
  const bg=ctx.createLinearGradient(x,y,x+w,y+h);
  bg.addColorStop(0,'#8ab4e8');bg.addColorStop(.3,'#d4e8ff');bg.addColorStop(.6,'#a8c8f0');bg.addColorStop(1,'#6090c8');
  ctx.beginPath();ctx.moveTo(cx,y+2);
  ctx.bezierCurveTo(cx+3,y+h*.18,cx+w/2,y+h*.3,cx+w/2,y+h*.52);
  ctx.lineTo(cx+w/2,y+h*.82);ctx.lineTo(cx-w/2,y+h*.82);ctx.lineTo(cx-w/2,y+h*.52);
  ctx.bezierCurveTo(cx-w/2,y+h*.3,cx-3,y+h*.18,cx,y+2);
  ctx.fillStyle=bg;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-3,y+h*.12);ctx.bezierCurveTo(cx-3,y+h*.25,cx-3,y+h*.4,cx-4,y+h*.5);
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();
  const wg=ctx.createRadialGradient(cx-1,y+h*.28,0,cx,y+h*.32,6);
  wg.addColorStop(0,'#fff');wg.addColorStop(.4,'#80eeff');wg.addColorStop(1,'#0066aa');
  ctx.beginPath();ctx.ellipse(cx,y+h*.32,5.5,6.5,0,0,Math.PI*2);ctx.fillStyle=wg;ctx.fill();
  ctx.strokeStyle='rgba(180,230,255,.6)';ctx.lineWidth=.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-w/2,y+h*.72);ctx.lineTo(cx-w/2-10,y+h*.97);ctx.lineTo(cx-w/2+2,y+h*.86);ctx.lineTo(cx-w/2,y+h*.72);
  const lfg=ctx.createLinearGradient(cx-w/2-10,0,cx-w/2,0);lfg.addColorStop(0,'#5070a8');lfg.addColorStop(1,'#8aafe8');ctx.fillStyle=lfg;ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+w/2,y+h*.72);ctx.lineTo(cx+w/2+10,y+h*.97);ctx.lineTo(cx+w/2-2,y+h*.86);ctx.lineTo(cx+w/2,y+h*.72);
  const rfg=ctx.createLinearGradient(cx+w/2,0,cx+w/2+10,0);rfg.addColorStop(0,'#8aafe8');rfg.addColorStop(1,'#5070a8');ctx.fillStyle=rfg;ctx.fill();
  ctx.fillStyle='rgba(0,200,255,.45)';ctx.fillRect(cx-w/2+1,y+h*.57,w-2,3.5);
  [-1,1].forEach(s=>{const nx=cx+s*(w/2-6);ctx.beginPath();ctx.ellipse(nx,y+h*.84,3,4,0,0,Math.PI*2);ctx.fillStyle='#334466';ctx.fill();ctx.strokeStyle='rgba(0,180,255,.4)';ctx.lineWidth=.5;ctx.stroke();});
  ctx.restore();
}


function Voltar() {
    window.location.href= "index.html"
}

function drawEnemy(e){
  const cx=e.x+e.w/2,cy=e.y+e.h/2,f=e.flash>0?1:0;
  ctx.save();
  if(e.type==='scout'){
    const g=ctx.createLinearGradient(cx-14,cy,cx+14,cy);
    g.addColorStop(0,f?'#ffaaaa':'#cc2244');g.addColorStop(.5,f?'#fff':'#ff6655');g.addColorStop(1,f?'#ffaaaa':'#cc2244');
    ctx.beginPath();ctx.moveTo(cx-2,cy-14);ctx.lineTo(cx-18,cy+8);ctx.lineTo(cx-12,cy+14);ctx.lineTo(cx-4,cy+6);ctx.fillStyle=f?'#ff8888':'#991133';ctx.fill();
    ctx.beginPath();ctx.moveTo(cx+2,cy-14);ctx.lineTo(cx+18,cy+8);ctx.lineTo(cx+12,cy+14);ctx.lineTo(cx+4,cy+6);ctx.fillStyle=f?'#ff8888':'#991133';ctx.fill();
    ctx.beginPath();ctx.moveTo(cx,cy-16);ctx.bezierCurveTo(cx+10,cy-8,cx+9,cy+4,cx+6,cy+14);ctx.lineTo(cx-6,cy+14);ctx.bezierCurveTo(cx-9,cy+4,cx-10,cy-8,cx,cy-16);ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.ellipse(cx,cy-4,4,5,0,0,Math.PI*2);ctx.fillStyle=f?'#fff':'#ffdd88';ctx.fill();
  } else if(e.type==='fighter'){
    const g=ctx.createLinearGradient(cx-16,cy,cx+16,cy);
    g.addColorStop(0,f?'#ddaaff':'#7711cc');g.addColorStop(.5,f?'#fff':'#cc66ff');g.addColorStop(1,f?'#ddaaff':'#7711cc');
    ctx.beginPath();ctx.moveTo(cx,cy-10);ctx.lineTo(cx+20,cy+2);ctx.lineTo(cx+14,cy+14);ctx.lineTo(cx+7,cy+5);ctx.fillStyle=f?'#cc88ff':'#5500aa';ctx.fill();
    ctx.beginPath();ctx.moveTo(cx,cy-10);ctx.lineTo(cx-20,cy+2);ctx.lineTo(cx-14,cy+14);ctx.lineTo(cx-7,cy+5);ctx.fillStyle=f?'#cc88ff':'#5500aa';ctx.fill();
    ctx.beginPath();ctx.moveTo(cx,cy-16);ctx.lineTo(cx+8,cy+4);ctx.lineTo(cx+6,cy+16);ctx.lineTo(cx-6,cy+16);ctx.lineTo(cx-8,cy+4);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.ellipse(cx,cy+2,5,6,0,0,Math.PI*2);ctx.fillStyle=f?'#fff':'#ff88cc';ctx.fill();
    [-6,6].forEach(ox=>{ctx.fillStyle=f?'#ddaaff':'#8844cc';ctx.fillRect(cx+ox-1.5,cy-18,3,6);});
  } else {
    const g=ctx.createLinearGradient(cx-18,cy,cx+18,cy);
    g.addColorStop(0,f?'#aaffcc':'#115533');g.addColorStop(.4,f?'#fff':'#44cc88');g.addColorStop(1,f?'#aaffcc':'#115533');
    ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.strokeStyle=f?'rgba(150,255,200,.8)':'rgba(60,200,120,.3)';ctx.lineWidth=1;ctx.stroke();
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2;ctx.beginPath();ctx.arc(cx+Math.cos(a)*16,cy+Math.sin(a)*16,4,0,Math.PI*2);ctx.fillStyle=f?'#88ffcc':'#226644';ctx.fill();}
    ctx.beginPath();ctx.arc(cx,cy,14,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fillStyle=f?'#fff':'#aaffcc';ctx.fill();
    [-8,8].forEach(ox=>{ctx.save();ctx.translate(cx+ox,cy);ctx.rotate(-Math.PI/2);ctx.fillStyle=f?'#ccffee':'#337755';ctx.fillRect(-2,-16,4,12);ctx.restore();});
    const pct=e.hp/e.maxHp;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(cx-16,cy+22,32,5);
    ctx.fillStyle=pct>.6?'#44ff88':pct>.3?'#ffaa00':'#ff4444';ctx.fillRect(cx-16,cy+22,32*pct,5);
  }
  ctx.restore();
}

function gameOver(){
  running=false;
  overlay.classList.remove('hidden');
  overlayTitle.className='overlay-title gameover-title';
  overlayTitle.textContent='GAME OVER';
  let si=overlay.querySelector('.overlay-score');
  if(!si){si=document.createElement('div');si.className='overlay-score';overlay.insertBefore(si,startBtn);}
  si.innerHTML=score>=highScore&&score>0?'Novo recorde! <span>'+score+' pts</span>':'Pontuação: <span>'+score+' pts</span>';
  startBtn.textContent='JOGAR NOVAMENTE';
}

startBtn.addEventListener('click',()=>{
  overlayTitle.className='overlay-title start-title';
  overlayTitle.innerHTML='NAVE<br>ESPACIAL';
  const si=overlay.querySelector('.overlay-score');if(si) si.remove();
  startBtn.textContent='INICIAR';
  start();
});

initStars();
</script>
</body>
</html>
