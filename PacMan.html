<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man Arcade</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at center, #11152c 0%, #05050b 55%, #000 100%);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
}

#game-container {
    width: min(720px, 100%);
    margin: 0 auto;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 12px;
}

.logo {
    color: #ffe600;
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow:
        0 0 5px #ffe600,
        0 0 18px rgba(255, 230, 0, .35);
}

.subtitle {
    color: #777;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 2px;
}

.score-area {
    display: flex;
    gap: 25px;
    text-align: right;
}

.score-box span {
    display: block;
    color: #777;
    font-size: 10px;
    letter-spacing: 2px;
}

.score-box strong {
    display: block;
    font-size: 22px;
    margin-top: 3px;
}

#screen {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    background: black;
    border: 2px solid #22243a;
    box-shadow:
        0 0 20px rgba(0,0,0,.8),
        0 0 60px rgba(15,30,100,.15);
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    background: black;
    image-rendering: pixelated;
    touch-action: none;
}

#overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.78);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 10;
    padding: 20px;
}

#overlay.hidden {
    display: none;
}

#overlay h1 {
    margin: 0 0 12px;
    font-size: clamp(30px, 8vw, 52px);
    color: #ffe600;
    letter-spacing: 4px;
    text-shadow: 0 0 16px rgba(255,230,0,.5);
}

#overlay p {
    color: #ddd;
    margin: 0 0 22px;
}

button {
    border: 2px solid #ffe600;
    background: #050505;
    color: #ffe600;
    padding: 11px 25px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 2px;
    border-radius: 3px;
}

button:hover {
    background: #191900;
}

button:active {
    transform: translateY(1px);
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 55px;
    margin-top: 12px;
    gap: 10px;
}

#lives {
    display: flex;
    gap: 10px;
    min-width: 100px;
}

.life {
    width: 25px;
    height: 25px;
    background: #ffe600;
    border-radius: 50%;
    position: relative;
}

.life::after {
    content: "";
    position: absolute;
    right: -1px;
    top: 4px;
    width: 15px;
    height: 17px;
    background: black;
    clip-path: polygon(0 50%,100% 0,100% 100%);
}

.controls {
    color: #777;
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
    flex: 1;
}

.button-row {
    display: flex;
    gap: 8px;
}

.small-btn {
    padding: 7px 10px;
    font-size: 10px;
}

@media(max-width:600px) {

    body {
        padding: 7px;
    }

    .controls {
        display: none;
    }

    .score-area {
        gap: 10px;
    }

    .score-box strong {
        font-size: 17px;
    }

}
</style>

</head>

<body>

<div id="game-container">

    <div class="top">

        <div>

            <div class="logo">
                PAC-MAN
            </div>

            <div class="subtitle">
                HTML5 ARCADE EDITION
            </div>

        </div>

        <div class="score-area">

            <div class="score-box">

                <span>SCORE</span>

                <strong id="score">
                    000000
                </strong>

            </div>

            <div class="score-box">

                <span>HIGH SCORE</span>

                <strong id="high-score">
                    000000
                </strong>

            </div>

        </div>

    </div>


    <div id="screen">

        <canvas
            id="game"
            width="560"
            height="620">
        </canvas>


        <div id="overlay">

            <h1 id="overlay-title">
                READY!
            </h1>

            <p id="overlay-message">
                Use as setas ou WASD para jogar
            </p>

            <button id="start">
                INICIAR
            </button>

        </div>

    </div>


    <div class="bottom">

        <div id="lives"></div>

        <div class="controls">
            SETAS / WASD &nbsp; • &nbsp; P = PAUSAR
        </div>

        <div class="button-row">

            <button id="pause" class="small-btn">
                ⏸ PAUSA
            </button>

            <button id="back" class="small-btn">
                ⏮ VOLTAR
            </button>

            <button onclick="voltar()" class="small-btn">VOLTAR</button>

            <button id="sound" class="small-btn">
                🔊 SOM
            </button>

        </div>

    </div>

</div>

<script>

/* ============================================================
   CONFIGURAÇÃO GERAL
============================================================ */

"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const TILE = 20;
const COLS = 28;
const ROWS = 31;

const WIDTH = COLS * TILE;
const HEIGHT = ROWS * TILE;

/*
    As posições internas (jogador, fantasmas, mapa) trabalham em um
    sistema de grade onde cada célula vale TILE pixels, mas a origem
    de cada célula fica no seu CANTO (múltiplos de TILE). Isso é ótimo
    para a matemática de colisão, mas para DESENHAR precisamos
    deslocar meio tile, senão os personagens ficam "grudados" numa
    das paredes do corredor em vez de centralizados nele.
*/
const HALF = TILE / 2;


/* ============================================================
   ELEMENTOS DA INTERFACE
============================================================ */

const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("high-score");
const livesElement = document.getElementById("lives");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const overlayMessage = document.getElementById("overlay-message");
const startButton = document.getElementById("start");
const pauseButton = document.getElementById("pause");
const backButton = document.getElementById("back");
const soundButton = document.getElementById("sound");


/* ============================================================
   MAPA
   1 = parede | 0 = caminho vazio | 2 = pellet
   3 = power pellet | 4 = porta da casa dos fantasmas
============================================================ */

const BASE_MAP_ROWS = [
"1111111111111111111111111111",
"1222222222222111222222222221",
"1211112111112112111111211121",
"1311112111112112111111211131",
"1211112111112112111111211121",
"1222222222222222222222222221",
"1211112112111111112112111121",
"1211112112111111112112111121",
"1222222122222111222222122221",
"1111112121112112111212111111",
"0000012121112112111212100000",
"0000012121112112111212100000",
"1111112122222222222212111111",
"0000022121111441111212200000",
"1111112121111001111212111111",
"0000022222222002222222220000",
"1111112121111001111212111111",
"0000012122222222222212100000",
"0000012121112112111212100000",
"1111112121112112111212111111",
"1222222222222111222222222221",
"1211112111112112111111211121",
"1311112111112112111111211131",
"1211122222222222222222211121",
"1211121121111111111211211121",
"1222222122222111222222122221",
"1111112112112112112112111111",
"1222222222222222222222222221",
"1211111111111111111111111121",
"1222222222222222222222222221",
"1111111111111111111111111111"
];

function buildMapFromBase() {

    return BASE_MAP_ROWS.map(
        row => row.split("").map(Number)
    );

}

let map = buildMapFromBase();


/* ============================================================
   DIREÇÕES
============================================================ */

const DIR = {
    LEFT:  { x: -1, y: 0, name: "left" },
    RIGHT: { x: 1,  y: 0, name: "right" },
    UP:    { x: 0,  y: -1, name: "up" },
    DOWN:  { x: 0,  y: 1,  name: "down" },
    NONE:  { x: 0,  y: 0,  name: "none" }
};

const ALL_DIRECTIONS = [ DIR.UP, DIR.LEFT, DIR.DOWN, DIR.RIGHT ];

const OPPOSITE = {
    left: DIR.RIGHT,
    right: DIR.LEFT,
    up: DIR.DOWN,
    down: DIR.UP,
    none: DIR.NONE
};


/* ============================================================
   UTILITÁRIOS DE GRADE / COLISÃO
   Regra única e centralizada: SOMENTE o valor 1 bloqueia.
   Todo mundo (Pac-Man e fantasmas) usa exatamente esta função,
   então não existe divergência de regras que permita atravessar
   paredes.
============================================================ */

function isWalkableCell(x, y) {

    if (y < 0 || y >= ROWS) return false;

    /* túnel lateral: fora da grade horizontalmente = livre */
    if (x < 0 || x >= COLS) return true;

    return map[y][x] !== 1;

}

function pixelToCell(x, y) {

    return {
        x: Math.round(x / TILE),
        y: Math.round(y / TILE)
    };

}

function cellCenterPixel(cellX, cellY) {

    return { x: cellX * TILE, y: cellY * TILE };

}

/* Próxima célula considerando o wraparound horizontal do túnel */
function nextCell(cell, direction) {

    let x = cell.x + direction.x;
    const y = cell.y + direction.y;

    if (x < 0) x = COLS - 1;
    if (x >= COLS) x = 0;

    return { x, y };

}

function canMoveFromCell(cell, direction) {

    if (!direction || direction === DIR.NONE) return false;

    const target = nextCell(cell, direction);

    return isWalkableCell(target.x, target.y);

}

function isExactlyAtCenter(entity) {

    const roundedX = Math.round(entity.x / TILE) * TILE;
    const roundedY = Math.round(entity.y / TILE) * TILE;

    return (
        Math.abs(entity.x - roundedX) < 0.01 &&
        Math.abs(entity.y - roundedY) < 0.01
    );

}

/* Distância (em pixels) até o próximo centro de célula na direção atual */
function distanceToNextCenter(x, y, direction) {

    const EPS = 0.0001;

    if (direction.x !== 0) {

        const targetCol = direction.x > 0
            ? Math.ceil((x + EPS) / TILE)
            : Math.floor((x - EPS) / TILE);

        return Math.abs(targetCol * TILE - x);

    }

    if (direction.y !== 0) {

        const targetRow = direction.y > 0
            ? Math.ceil((y + EPS) / TILE)
            : Math.floor((y - EPS) / TILE);

        return Math.abs(targetRow * TILE - y);

    }

    return 0;

}

function wrapHorizontal(entity) {

    if (entity.x < 0) entity.x += WIDTH;
    if (entity.x >= WIDTH) entity.x -= WIDTH;

}

/*
    Move qualquer entidade (Pac-Man ou fantasma) de forma segura:
    o deslocamento nunca ultrapassa o próximo centro de célula,
    então é fisicamente impossível "pular" para dentro de uma
    parede, mesmo em quedas de FPS.

    Quando a entidade chega exatamente a um centro de célula,
    "decideDirection" é chamado para escolher a próxima direção
    ANTES de continuar o movimento - assim a curva sempre respeita
    paredes.
*/
function stepEntity(entity, delta, speed, decideDirection) {

    if (isExactlyAtCenter(entity)) {

        const cell = pixelToCell(entity.x, entity.y);

        entity.x = cell.x * TILE;
        entity.y = cell.y * TILE;

        decideDirection(entity, cell);

    }

    if (entity.direction === DIR.NONE || speed <= 0) return;

    const distanceToCenter = distanceToNextCenter(entity.x, entity.y, entity.direction);
    let movement = speed * delta;

    if (movement >= distanceToCenter) {

        entity.x += entity.direction.x * distanceToCenter;
        entity.y += entity.direction.y * distanceToCenter;

        entity.x = Math.round(entity.x / TILE) * TILE;
        entity.y = Math.round(entity.y / TILE) * TILE;

    } else {

        entity.x += entity.direction.x * movement;
        entity.y += entity.direction.y * movement;

    }

    wrapHorizontal(entity);

}


/* ============================================================
   ÁUDIO
============================================================ */

class AudioSystem {

    constructor() {
        this.enabled = true;
        this.context = null;
    }

    init() {

        if (!this.enabled) return;

        if (!this.context) {

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;

            this.context = new AudioContext();

        }

        if (this.context.state === "suspended") this.context.resume();

    }

    tone(frequency, duration = .06, type = "square", volume = .03, delay = 0) {

        if (!this.enabled) return;

        this.init();
        if (!this.context) return;

        const now = this.context.currentTime + delay;

        const oscillator = this.context.createOscillator();
        const gain = this.context.createGain();

        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, now);

        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(.001, now + duration);

        oscillator.connect(gain).connect(this.context.destination);

        oscillator.start(now);
        oscillator.stop(now + duration);

    }

    intro() {
        [261.6, 329.6, 392, 523.2, 392, 329.6, 261.6].forEach(
            (f, i) => this.tone(f, .11, "square", .025, i * .12)
        );
    }

    pellet() { this.tone(650, .035, "square", .025); }

    power() {
        this.tone(180, .12, "square", .04);
        this.tone(360, .14, "square", .035, .10);
    }

    ghostEaten() {
        this.tone(900, .05, "square", .045);
        this.tone(1400, .09, "square", .04, .05);
    }

    fruit() {
        this.tone(600, .08, "triangle", .04);
        this.tone(900, .12, "triangle", .035, .08);
    }

    death() {
        [500, 450, 400, 350, 300, 250, 200].forEach(
            (f, i) => this.tone(f, .10, "sawtooth", .025, i * .07)
        );
    }

    extraLife() {
        [400, 500, 600, 800].forEach(
            (f, i) => this.tone(f, .10, "triangle", .04, i * .09)
        );
    }

}

const audio = new AudioSystem();


/* ============================================================
   ESTADO GERAL DO JOGO
============================================================ */

let score = 0;
let highScore = Number(localStorage.getItem("pacman-high-score") || 0);
let lives = 3;
let level = 1;

let pelletsRemaining = 0;
let totalPellets = 0;

let extraLifeAwarded = false;

/* READY | PLAYING | PAUSED | DYING | LEVEL_CLEAR | GAME_OVER */
let gameState = "READY";

let mode = "SCATTER";
let modeIndex = 0;
let modeTimer = 0;

const MODE_SCHEDULE = [
    { mode: "SCATTER", duration: 7 },
    { mode: "CHASE",   duration: 20 },
    { mode: "SCATTER", duration: 7 },
    { mode: "CHASE",   duration: 20 },
    { mode: "SCATTER", duration: 5 },
    { mode: "CHASE",   duration: 20 },
    { mode: "SCATTER", duration: 5 },
    { mode: "CHASE",   duration: Infinity }
];

let ghostCombo = 0;

let fruit = null;
let fruitTimer = 0;
let fruitSpawnsUsed = [];

let deathTimer = 0;
let levelClearTimer = 0;

let lastTime = 0;


/* ============================================================
   POSIÇÕES INICIAIS
============================================================ */

const PLAYER_START = { x: 13, y: 23 };

const GHOST_HOUSE_DOOR = { x: 13, y: 13 };
const GHOST_HOUSE_EXIT = { x: 13, y: 11 };


/* ============================================================
   PAC-MAN
============================================================ */

class Player {

    constructor() {

        this.radius = 8;
        this.reset();

    }

    reset() {

        const p = cellCenterPixel(PLAYER_START.x, PLAYER_START.y);

        this.x = p.x;
        this.y = p.y;

        this.direction = DIR.LEFT;
        this.nextDirection = DIR.LEFT;

        this.animation = 0;

    }

    cell() {
        return pixelToCell(this.x, this.y);
    }

    getSpeed() {

        const base = 92 + (level - 1) * 2;
        return Math.min(base, 118);

    }

    update(delta) {

        stepEntity(this, delta, this.getSpeed(), (player, cell) => {

            if (
                player.nextDirection !== DIR.NONE &&
                canMoveFromCell(cell, player.nextDirection)
            ) {

                player.direction = player.nextDirection;

            } else if (!canMoveFromCell(cell, player.direction)) {

                player.direction = DIR.NONE;

            }

        });

        if (this.direction !== DIR.NONE) {
            this.animation += delta * 12;
        }

        collectItems();
        checkFruitCollision();

    }

    draw(scale) {

        if (scale === undefined) scale = 1;
        if (scale <= 0) return;

        let rotation = 0;

        if (this.direction === DIR.DOWN) rotation = Math.PI / 2;
        else if (this.direction === DIR.LEFT) rotation = Math.PI;
        else if (this.direction === DIR.UP) rotation = -Math.PI / 2;

        const mouth = .16 + Math.abs(Math.sin(this.animation)) * .23;

        ctx.save();
        ctx.translate(this.x + HALF, this.y + HALF);
        ctx.rotate(rotation + (1 - scale) * Math.PI * 2);
        ctx.scale(scale, scale);

        ctx.fillStyle = "#ffe600";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, this.radius, mouth * Math.PI, (2 - mouth) * Math.PI);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

    }

}


/* ============================================================
   FANTASMAS
   IA determinística clássica: cada fantasma persegue um alvo
   (perseguição direta, emboscada, flanco ou fuga condicional)
   e, em cada cruzamento, escolhe entre as direções válidas a
   que mais aproxima da célula-alvo. Só existe aleatoriedade
   quando o fantasma está ASSUSTADO (fugindo do Pac-Man).
============================================================ */

class Ghost {

    constructor(name, color, homeCell, scatterCell, releaseDelay) {

        this.name = name;
        this.color = color;

        this.homeCell = homeCell;
        this.scatterCell = scatterCell;
        this.releaseDelay = releaseDelay;

        this.reset();

    }

    reset() {

        const p = cellCenterPixel(this.homeCell.x, this.homeCell.y);

        this.x = p.x;
        this.y = p.y;

        this.direction = DIR.UP;

        /* house | normal | frightened | eaten */
        this.state = this.releaseDelay > 0 ? "house" : "normal";
        this.houseTimer = this.releaseDelay;
        this.houseBobbing = Math.random() * 10;

        this.frightenedTimer = 0;

    }

    cell() {
        return pixelToCell(this.x, this.y);
    }

    getSpeed() {

        const base = 82 + (level - 1) * 1.5;

        if (this.state === "frightened") return Math.min(base, 100) * 0.55;
        if (this.state === "eaten") return Math.min(base, 100) * 2.1;

        return Math.min(base, 100);

    }

    enterFrightened() {

        if (this.state === "eaten" || this.state === "house") return;

        this.state = "frightened";
        this.frightenedTimer = Math.max(4, 8 - (level - 1) * 0.4);

        /* Reversão imediata ao ficar assustado (comportamento clássico) */
        const reversed = OPPOSITE[this.direction.name];

        if (canMoveFromCell(this.cell(), reversed)) {
            this.direction = reversed;
        }

    }

    getChaseTarget(player, blinky) {

        const pc = player.cell();

        if (this.name === "blinky") {
            return pc;
        }

        if (this.name === "pinky") {

            return {
                x: pc.x + player.direction.x * 4,
                y: pc.y + player.direction.y * 4
            };

        }

        if (this.name === "inky") {

            const ahead = {
                x: pc.x + player.direction.x * 2,
                y: pc.y + player.direction.y * 2
            };

            const bcell = blinky.cell();

            return {
                x: ahead.x + (ahead.x - bcell.x),
                y: ahead.y + (ahead.y - bcell.y)
            };

        }

        /* clyde: persegue de longe, foge para o canto de perto */
        const gc = this.cell();
        const dist = Math.hypot(pc.x - gc.x, pc.y - gc.y);

        return dist > 8 ? pc : this.scatterCell;

    }

    chooseBestDirection(cell, options, target) {

        let best = options[0];
        let bestDistance = Infinity;

        for (const dir of options) {

            const next = nextCell(cell, dir);
            const dx = next.x - target.x;
            const dy = next.y - target.y;
            const distance = dx * dx + dy * dy;

            if (distance < bestDistance) {
                bestDistance = distance;
                best = dir;
            }

        }

        return best;

    }

    decideDirection(cell, player, blinky) {

        const reverse = OPPOSITE[this.direction.name];

        let options = ALL_DIRECTIONS.filter(
            dir => canMoveFromCell(cell, dir) && dir !== reverse
        );

        if (options.length === 0) {
            options = ALL_DIRECTIONS.filter(dir => canMoveFromCell(cell, dir));
        }

        if (options.length === 0) {
            this.direction = DIR.NONE;
            return;
        }

        if (this.state === "eaten") {

            this.direction = this.chooseBestDirection(cell, options, GHOST_HOUSE_DOOR);
            return;

        }

        if (this.state === "frightened") {

            this.direction = options[Math.floor(Math.random() * options.length)];
            return;

        }

        const target = mode === "SCATTER"
            ? this.scatterCell
            : this.getChaseTarget(player, blinky);

        this.direction = this.chooseBestDirection(cell, options, target);

    }

    update(delta, player, blinky) {

        if (this.state === "house") {

            this.houseTimer -= delta;
            this.houseBobbing += delta * 4;

            if (this.houseTimer <= 0) {

                const doorPixel = cellCenterPixel(GHOST_HOUSE_DOOR.x, GHOST_HOUSE_DOOR.y);

                this.x = doorPixel.x;
                this.y = doorPixel.y;
                this.direction = DIR.UP;
                this.state = "normal";

            }

            return;

        }

        if (this.state === "frightened") {

            this.frightenedTimer -= delta;

            if (this.frightenedTimer <= 0) {
                this.state = "normal";
            }

        }

        stepEntity(this, delta, this.getSpeed(), (ghost, cell) => {
            ghost.decideDirection(cell, player, blinky);
        });

        if (this.state === "eaten") {

            const cell = this.cell();

            if (cell.x === GHOST_HOUSE_DOOR.x && cell.y === GHOST_HOUSE_DOOR.y) {

                this.state = "house";
                this.houseTimer = 1.2;

                const home = cellCenterPixel(this.homeCell.x, this.homeCell.y);
                this.x = home.x;
                this.y = home.y;
                this.direction = DIR.UP;

            }

        }

    }

    draw() {

        const bobY = this.state === "house"
            ? Math.sin(this.houseBobbing) * 3
            : 0;

        const x = this.x + HALF;
        const y = this.y + bobY + HALF;
        const r = 8.6;

        let bodyColor = this.color;

        if (this.state === "frightened") {

            bodyColor = (this.frightenedTimer < 2 && Math.floor(this.frightenedTimer * 6) % 2 === 0)
                ? "#ffffff"
                : "#2121ff";

        }

        if (this.state !== "eaten") {

            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = bodyColor;

            ctx.beginPath();
            ctx.arc(0, 0, r, Math.PI, 0);
            ctx.lineTo(r, r * 0.8);

            for (let i = 0; i < 4; i++) {

                const stepX = r - (i * (2 * r / 4));
                const waveY = (i % 2 === 0) ? r * 0.8 : r * 0.4;
                ctx.lineTo(stepX - (r / 4), waveY);

            }

            ctx.lineTo(-r, r * 0.8);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

        }

        /* olhos */
        const eyeOffsetX = 4;
        const eyeOffsetY = -2;
        const pupil = this.direction;

        ctx.save();
        ctx.translate(x, y);

        [-1, 1].forEach(side => {

            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(side * eyeOffsetX, eyeOffsetY, 3.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#12233f";
            ctx.beginPath();
            ctx.arc(
                side * eyeOffsetX + pupil.x * 1.4,
                eyeOffsetY + pupil.y * 1.4,
                1.6, 0, Math.PI * 2
            );
            ctx.fill();

        });

        ctx.restore();

    }

}


/* ============================================================
   INSTÂNCIAS
============================================================ */

const player = new Player();

const ghosts = [

    new Ghost("blinky", "#ff0000", { x: 13, y: 13 }, { x: 26, y: 1 }, 0),
    new Ghost("pinky",  "#ffb8ff", { x: 13, y: 15 }, { x: 1, y: 1 },  2.5),
    new Ghost("inky",   "#00ffff", { x: 14, y: 15 }, { x: 26, y: 29 }, 5),
    new Ghost("clyde",  "#ffb852", { x: 13, y: 16 }, { x: 1, y: 29 }, 7.5)

];

const blinky = ghosts[0];


/* ============================================================
   PELLETS / FRUTAS / PONTUAÇÃO
============================================================ */

function countPellets() {

    let count = 0;

    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            if (map[y][x] === 2 || map[y][x] === 3) count++;
        }
    }

    return count;

}

function collectItems() {

    if (gameState !== "PLAYING") return;

    const cell = player.cell();

    if (cell.y < 0 || cell.y >= ROWS || cell.x < 0 || cell.x >= COLS) return;

    const value = map[cell.y][cell.x];

    if (value === 2) {

        map[cell.y][cell.x] = 0;
        pelletsRemaining--;
        addScore(10);
        audio.pellet();
        maybeSpawnFruit();

    } else if (value === 3) {

        map[cell.y][cell.x] = 0;
        pelletsRemaining--;
        addScore(50);
        audio.power();
        ghostCombo = 0;

        ghosts.forEach(g => g.enterFrightened());

        maybeSpawnFruit();

    }

    if (pelletsRemaining <= 0) {
        startLevelClear();
    }

}

function maybeSpawnFruit() {

    const eaten = totalPellets - pelletsRemaining;
    const triggerPoints = [70, 170];

    triggerPoints.forEach((threshold, index) => {

        if (eaten >= threshold && !fruitSpawnsUsed[index]) {

            fruitSpawnsUsed[index] = true;

            fruit = {
                x: 13, y: 17,
                value: index === 0 ? 100 : 300,
                label: index === 0 ? "🍒" : "🍇"
            };

            fruitTimer = 9;

        }

    });

}

function checkFruitCollision() {

    if (!fruit) return;

    const cell = player.cell();

    if (cell.x === fruit.x && cell.y === fruit.y) {

        addScore(fruit.value);
        audio.fruit();
        fruit = null;

    }

}

function addScore(points) {

    score += points;

    if (score > highScore) {
        highScore = score;
    }

    if (!extraLifeAwarded && score >= 10000) {

        extraLifeAwarded = true;
        lives++;
        audio.extraLife();
        renderLives();

    }

    renderScore();

}


/* ============================================================
   COLISÃO PAC-MAN x FANTASMAS
============================================================ */

function checkGhostCollisions() {

    if (gameState !== "PLAYING") return;

    for (const ghost of ghosts) {

        if (ghost.state === "house") continue;

        const dx = ghost.x - player.x;
        const dy = ghost.y - player.y;
        const distance = Math.hypot(dx, dy);

        if (distance > 13) continue;

        if (ghost.state === "frightened") {

            ghostCombo++;
            const points = 200 * Math.pow(2, Math.min(ghostCombo - 1, 3));

            addScore(points);
            audio.ghostEaten();

            ghost.state = "eaten";

        } else if (ghost.state === "normal") {

            loseLife();
            return;

        }

    }

}


/* ============================================================
   CONTROLE DE ESTADO DO JOGO
============================================================ */

function renderScore() {

    scoreElement.textContent = String(score).padStart(6, "0");
    highScoreElement.textContent = String(highScore).padStart(6, "0");

}

function renderLives() {

    livesElement.innerHTML = "";

    for (let i = 0; i < Math.max(lives - 1, 0); i++) {

        const life = document.createElement("div");
        life.className = "life";
        livesElement.appendChild(life);

    }
}

function voltar() {
  window.location.href = "index.html";
}

function showOverlay(title, message, buttonLabel) {

    overlayTitle.textContent = title;
    overlayMessage.textContent = message;
    startButton.textContent = buttonLabel;
    overlay.classList.remove("hidden");

}

function hideOverlay() {
    overlay.classList.add("hidden");
}

function resetPositions() {

    player.reset();
    ghosts.forEach(g => g.reset());

    modeIndex = 0;
    mode = MODE_SCHEDULE[0].mode;
    modeTimer = MODE_SCHEDULE[0].duration;

    ghostCombo = 0;

}

function startNewLevel(resetLevelNumber) {

    if (resetLevelNumber) level = 1;

    map = buildMapFromBase();
    totalPellets = countPellets();
    pelletsRemaining = totalPellets;

    fruit = null;
    fruitTimer = 0;
    fruitSpawnsUsed = [];

    resetPositions();

}

function startNewGame() {

    score = 0;
    lives = 3;
    extraLifeAwarded = false;

    startNewLevel(true);

    renderScore();
    renderLives();

    gameState = "READY";

    showOverlay("PRONTO!", "Use as setas ou WASD para jogar", "INICIAR");

}

function beginPlaying() {

    hideOverlay();
    gameState = "PLAYING";

}

function loseLife() {

    gameState = "DYING";
    deathTimer = 1.4;

    audio.death();

}

function startLevelClear() {

    gameState = "LEVEL_CLEAR";
    levelClearTimer = 1.6;

}

function togglePause() {

    if (gameState === "PLAYING") {

        gameState = "PAUSED";
        showOverlay("PAUSADO", "Pressione continuar para voltar ao jogo", "CONTINUAR");

    } else if (gameState === "PAUSED") {

        beginPlaying();

    }

}

function goBackToMenu() {

    gameState = "READY";
    lastTime = 0;

    startNewGame();

}


/* ============================================================
   LOOP PRINCIPAL
============================================================ */

function updateModeTimer(delta) {

    if (mode === "SCATTER" || mode === "CHASE") {

        modeTimer -= delta;

        if (modeTimer <= 0 && modeIndex < MODE_SCHEDULE.length - 1) {

            modeIndex++;
            mode = MODE_SCHEDULE[modeIndex].mode;
            modeTimer = MODE_SCHEDULE[modeIndex].duration;

            ghosts.forEach(g => {

                if (g.state !== "normal") return;

                const reversed = OPPOSITE[g.direction.name];

                if (canMoveFromCell(g.cell(), reversed)) {
                    g.direction = reversed;
                }

            });

        }

    }

}

function update(delta) {

    if (gameState === "PLAYING") {

        updateModeTimer(delta);

        player.update(delta);
        ghosts.forEach(g => g.update(delta, player, blinky));

        checkGhostCollisions();

        if (fruit) {

            fruitTimer -= delta;
            if (fruitTimer <= 0) fruit = null;

        }

    } else if (gameState === "DYING") {

        deathTimer -= delta;

        if (deathTimer <= 0) {

            lives--;
            renderLives();

            if (lives <= 0) {

                gameState = "GAME_OVER";

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("pacman-high-score", String(highScore));
                }

                renderScore();

                showOverlay("FIM DE JOGO", "Sua pontuação: " + score, "JOGAR NOVAMENTE");

            } else {

                resetPositions();
                gameState = "PLAYING";

            }

        }

    } else if (gameState === "LEVEL_CLEAR") {

        levelClearTimer -= delta;

        if (levelClearTimer <= 0) {

            level++;
            startNewLevel(false);
            gameState = "PLAYING";

        }

    }

}


/* ============================================================
   RENDERIZAÇÃO
============================================================ */

function drawMaze() {

    ctx.strokeStyle = "#2121ff";
    ctx.fillStyle = "#000814";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.lineWidth = 2.4;
    ctx.lineJoin = "round";

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            if (map[y][x] !== 1) continue;

            const px = x * TILE;
            const py = y * TILE;

            ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);

        }

    }

}

function drawPellets() {

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            const value = map[y][x];

            if (value === 2) {

                ctx.fillStyle = "#ffd9a0";
                ctx.beginPath();
                ctx.arc(x * TILE + HALF, y * TILE + HALF, 2.2, 0, Math.PI * 2);
                ctx.fill();

            } else if (value === 3) {

                const pulse = 3.6 + Math.sin(performance.now() / 150) * 1.4;

                ctx.fillStyle = "#ffd9a0";
                ctx.beginPath();
                ctx.arc(x * TILE + HALF, y * TILE + HALF, pulse, 0, Math.PI * 2);
                ctx.fill();

            }

        }

    }

}

function drawFruit() {

    if (!fruit) return;

    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(fruit.label, fruit.x * TILE + HALF, fruit.y * TILE + HALF);

}

function drawHouseGate() {

    const px = GHOST_HOUSE_DOOR.x * TILE + HALF;
    const py = GHOST_HOUSE_DOOR.y * TILE + HALF;

    ctx.strokeStyle = "#ff9fd6";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px - TILE / 2 + 2, py);
    ctx.lineTo(px + TILE / 2 + TILE - 2, py);
    ctx.stroke();

}

function render() {

    drawMaze();
    drawHouseGate();
    drawPellets();
    drawFruit();

    if (gameState !== "DYING") {
        ghosts.forEach(g => g.draw());
    }

    if (gameState !== "GAME_OVER") {

        const scale = gameState === "DYING"
            ? Math.max(0, deathTimer / 1.4)
            : 1;

        player.draw(scale);

    }

}


/* ============================================================
   LOOP DE ANIMAÇÃO
============================================================ */

function frame(timestamp) {

    if (!lastTime) lastTime = timestamp;

    let delta = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    /* protege contra saltos grandes (aba em segundo plano etc.) */
    delta = Math.min(delta, 1 / 20);

    update(delta);
    render();

    requestAnimationFrame(frame);

}


/* ============================================================
   ENTRADA DO USUÁRIO
============================================================ */

function setNextDirection(direction) {

    player.nextDirection = direction;

    if (gameState === "READY") {
        beginPlaying();
    }

}

window.addEventListener("keydown", event => {

    const key = event.key.toLowerCase();

    const map2Dir = {
        arrowleft: DIR.LEFT,
        a: DIR.LEFT,
        arrowright: DIR.RIGHT,
        d: DIR.RIGHT,
        arrowup: DIR.UP,
        w: DIR.UP,
        arrowdown: DIR.DOWN,
        s: DIR.DOWN
    };

    if (map2Dir[key]) {

        event.preventDefault();
        setNextDirection(map2Dir[key]);
        return;

    }

    if (key === "p") {
        event.preventDefault();
        togglePause();
    }

});

/* controles por toque (swipe) */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", event => {

    const touch = event.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

}, { passive: true });

canvas.addEventListener("touchend", event => {

    const touch = event.changedTouches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;

    if (Math.abs(dx) > Math.abs(dy)) {
        setNextDirection(dx > 0 ? DIR.RIGHT : DIR.LEFT);
    } else {
        setNextDirection(dy > 0 ? DIR.DOWN : DIR.UP);
    }

}, { passive: true });


/* ============================================================
   BOTÕES
============================================================ */

startButton.addEventListener("click", () => {

    audio.init();

    if (gameState === "READY") {

        audio.intro();
        beginPlaying();

    } else if (gameState === "PAUSED") {

        beginPlaying();

    } else if (gameState === "GAME_OVER") {

        startNewGame();

    }

});

pauseButton.addEventListener("click", () => {

    audio.init();
    togglePause();

});

backButton.addEventListener("click", () => {

    audio.init();
    goBackToMenu();

});

soundButton.addEventListener("click", () => {

    audio.enabled = !audio.enabled;
    soundButton.textContent = audio.enabled ? "🔊 SOM" : "🔇 SOM";

    if (audio.enabled) audio.init();

});


/* ============================================================
   INICIALIZAÇÃO
============================================================ */

startNewGame();
requestAnimationFrame(frame);

</script>
