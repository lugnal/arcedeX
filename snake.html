<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake – ArcadeX</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background: radial-gradient(circle at top, #1b1b3a, #0a0a16 60%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 40px;
      background: rgba(10, 10, 22, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0, 229, 255, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area h1 {
      color: #00e5ff;
      font-size: 2.3rem;
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }

    .logo-area p {
      color: #bdbdf0;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .menu-topo {
      display: flex;
      gap: 20px;
    }

    .menu-topo a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .menu-topo a:hover {
      color: #00e5ff;
    }

    /* ── Game area ── */
    .game-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 20px;
    }

    .game-title {
      font-size: 2rem;
      color: #00e5ff;
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }

    /* ── HUD ── */
    .hud {
      display: flex;
      gap: 20px;
    }

    .hud-card {
      background: rgba(28, 28, 43, 0.95);
      border: 1px solid rgba(0, 229, 255, 0.08);
      border-radius: 18px;
      padding: 12px 28px;
      text-align: center;
      min-width: 120px;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.35);
    }

    .hud-label {
      font-size: 0.7rem;
      color: #8888aa;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .hud-value {
      font-size: 1.6rem;
      font-weight: bold;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    /* ── Canvas ── */
    .canvas-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.12), 0 0 60px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      background: rgba(28, 28, 43, 0.95);
    }

    /* ── Overlays ── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(10, 10, 22, 0.88);
      backdrop-filter: blur(4px);
      border-radius: 18px;
    }

    .overlay.hidden { display: none; }

    .overlay-title {
      font-size: 2rem;
      font-weight: bold;
      color: #00e5ff;
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    }

    .overlay-title.dead {
      background: linear-gradient(90deg, #8a2be2, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .overlay-score {
      color: #c9c9ff;
      font-size: 1rem;
      text-align: center;
      line-height: 1.8;
    }

    .overlay-score span {
      color: #00e5ff;
      font-weight: bold;
    }
    
    .btn {
      display: inline-block;
      background: linear-gradient(90deg, #00e5ff, #8a2be2);
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1rem;
      font-family: Arial, Helvetica, sans-serif;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 229,     255, 0.25);
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
    }

    .overlay-hint {
      color: #8888aa;
      font-size: 0.78rem;
      text-align: center;
      line-height: 2;
    }

    /* ── D-pad mobile ── */
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(3, 52px);
      gap: 6px;
    }

    @media (max-width: 600px), (pointer: coarse) {
      .dpad { display: grid; }
    }

    .dpad-btn {
      background: rgba(28, 28, 43, 0.95);
      border: 1px solid rgba(0, 229, 255, 0.15);
      border-radius: 12px;
      color: #00e5ff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn:active {
      background: rgba(0, 229, 255, 0.15);
      transform: scale(0.93);
    }

    .dpad-blank {
      background: transparent;
      border: none;
    }

    /* ── Controls hint ── */
    .controls-hint {
      color: #8888aa;
      font-size: 0.75rem;
      text-align: center;
      line-height: 2;
    }

    .key {
      display: inline-block;
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 4px;
      padding: 1px 6px;
      color: #bdbdf0;
      font-size: 0.72rem;
    }
    
    /* ── Footer ── */
    .rodape {
      text-align: center;
      padding: 25px;
      color: #aaaad5;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 768px) {
      .cabecalho {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
    }
    
  </style>
</head>
<body>

   
  </header>

  <div class="game-wrapper">

    <h2 class="game-title">🐍 Snake</h2>

    <div class="hud">
      <div class="hud-card">
        <div class="hud-label">Score</div>
        <div class="hud-value" id="score">0</div>
      </div>
      <div class="hud-card">
        <div class="hud-label">Recorde</div>
        <div class="hud-value" id="best">0</div>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas"></canvas>

      <div class="overlay" id="startScreen">
        <div class="overlay-title">🐍 Snake</div>
        <button class="btn" id="startBtn">▶ Iniciar</button>
        <button class="btn" id="backBtn">⬅ Voltar</button>
        <div class="overlay-hint">
          Setas / WASD para mover<br>P para pausar
        </div>
      </div>

      <div class="overlay hidden" id="gameOverScreen">
        <div class="overlay-title dead">Game Over</div>
        <div class="overlay-score" id="finalScore"></div>
        <button class="btn" id="restartBtn">↺ Jogar Novamente</button>
        <button class="btn" id="backBtn2">voltar</button>
      </div>

      <div class="overlay hidden" id="pauseScreen">
        <div class="overlay-title">Pausado</div>
        <button onclick="Voltar()" class="btn"">voltar</button>
        <button class="btn" id="resumeBtn">▶ Continuar</button>
      </div>
    </div>

    <div class="dpad" id="dpad">
      <div class="dpad-blank"></div>
      <button class="dpad-btn" id="btnUp">▲</button>
      <div class="dpad-blank"></div>
      <button class="dpad-btn" id="btnLeft">◀</button>
      <div class="dpad-blank"></div>
      <button class="dpad-btn" id="btnRight">▶</button>
      <div class="dpad-blank"></div>
      <button class="dpad-btn" id="btnDown">▼</button>
      <div class="dpad-blank"></div>
    </div>

    <div class="controls-hint">
      <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span>
      &nbsp;ou&nbsp;
      <span class="key">↑</span> <span class="key">←</span> <span class="key">↓</span> <span class="key">→</span>
      &nbsp;&nbsp;&nbsp;
      <span class="key">P</span> Pausar
    </div>

  </div>

  <footer class="rodape">
    <p>2026 ArcadeX Premium 😎</p>
  </footer>

<script>
  const GRID = 20;
  const canvas = document.getElementById('gameCanvas');
  const ctx    = canvas.getContext('2d');

  function getCellSize() {
    return window.innerWidth <= 600 ? 17 : 22;
  }

  let CELL = getCellSize();

  function resizeCanvas() {
    CELL = getCellSize();
    canvas.width  = GRID * CELL;
    canvas.height = GRID * CELL;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const COLORS = {
    grid:       'rgba(0, 229, 255, 0.04)',
    snakeHead:  '#00e5ff',
    snakeGlow:  'rgba(0, 229, 255, 0.8)',
    snakeBody:  '#8a2be2',
    food:       '#ff2d55',
    foodGlow:   'rgba(255, 45, 85, 0.7)',
    eye:        '#0a0a16',
  };

  let snake, dir, nextDir, food, score, best, gameLoop, state;
  let particles = [];
  let foodPulse = 0;

  const scoreEl        = document.getElementById('score');
  const bestEl         = document.getElementById('best');
  const finalEl        = document.getElementById('finalScore');
  const startScreen    = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const pauseScreen    = document.getElementById('pauseScreen');

  function loadBest() {
    try { return parseInt(localStorage.getItem('arcadex_snake_best') || '0'); } catch { return 0; }
  }
  function Voltar(){
    window.location.href = "index.html"
  }
  function saveBest(v) {
    try { localStorage.setItem('arcadex_snake_best', v); } catch {}
  }

  best = loadBest();
  bestEl.textContent = best;

  function initGame() {
    snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    scoreEl.textContent = 0;
    particles = [];
    spawnFood();
  }

  function spawnFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function getSpeed() {
    return Math.max(65, 155 - Math.floor(score / 3) * 8);
  }

  function startTick() {
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, getSpeed());
  }

  function tick() {
    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return endGame();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return endGame();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        saveBest(best);
      }
      spawnParticles(food.x, food.y);
      spawnFood();
      startTick();
    } else {
      snake.pop();
    }

    draw();
  }

  function spawnParticles(x, y) {
    for (let i = 0; i < 10; i++) {
      particles.push({
        x: x * CELL + CELL / 2,
        y: y * CELL + CELL / 2,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5,
        life: 1,
        r: Math.random() * 3 + 1,
      });
    }
  }

  function updateParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.06; });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = COLORS.grid;
    for (let x = 0; x < GRID; x++)
      for (let y = 0; y < GRID; y++)
        ctx.fillRect(x * CELL + CELL / 2 - 0.5, y * CELL + CELL / 2 - 0.5, 1, 1);

    snake.forEach((seg, i) => {
      const isHead = i === 0;
      const t = i / snake.length;

      if (isHead) {
        ctx.shadowColor = COLORS.snakeHead;
        ctx.shadowBlur  = 14;
        ctx.fillStyle   = COLORS.snakeHead;
      } else {
        ctx.shadowBlur  = 4;
        ctx.shadowColor = COLORS.snakeBody;
        const r1 = 0,   g1 = 229, b1 = 255;
        const r2 = 138, g2 = 43,  b2 = 226;
        const r = Math.round(r1 + (r2 - r1) * t);
        const g = Math.round(g1 + (g2 - g1) * t);
        const b = Math.round(b1 + (b2 - b1) * t);
        ctx.fillStyle = `rgba(${r},${g},${b},${1 - t * 0.4})`;
      }

      const pad = isHead ? 1 : 2;
      ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);

      if (isHead) {
        ctx.shadowBlur = 0;
        ctx.fillStyle  = COLORS.eye;
        const es = 3;
        const ex1 = dir.y !== 0 ? seg.x * CELL + CELL * 0.3 : seg.x * CELL + (dir.x > 0 ? CELL * 0.6 : CELL * 0.25);
        const ex2 = dir.y !== 0 ? seg.x * CELL + CELL * 0.7 : ex1;
        const ey1 = dir.x !== 0 ? seg.y * CELL + CELL * 0.3 : seg.y * CELL + (dir.y > 0 ? CELL * 0.6 : CELL * 0.25);
        const ey2 = dir.x !== 0 ? seg.y * CELL + CELL * 0.7 : ey1;
        ctx.fillRect(ex1 - 1, ey1 - 1, es, es);
        ctx.fillRect(ex2 - 1, ey2 - 1, es, es);
      }
    });

    ctx.shadowBlur = 0;

    foodPulse = (foodPulse + 0.1) % (Math.PI * 2);
    const pulse = 0.7 + Math.sin(foodPulse) * 0.3;

    ctx.shadowColor = COLORS.food;
    ctx.shadowBlur  = 18 * pulse;
    ctx.fillStyle   = `rgba(255, 45, 85, ${0.8 + pulse * 0.2})`;
    const fp = 3;
    ctx.fillRect(food.x * CELL + fp, food.y * CELL + fp, CELL - fp * 2, CELL - fp * 2);

    ctx.fillStyle = `rgba(255, 160, 185, ${pulse * 0.7})`;
    ctx.fillRect(food.x * CELL + fp + 2, food.y * CELL + fp + 2, CELL - (fp + 2) * 2, CELL - (fp + 2) * 2);

    ctx.shadowBlur = 0;

    updateParticles();
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle   = COLORS.food;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function endGame() {
    clearInterval(gameLoop);
    state = 'dead';

    const isRecord = score > 0 && score === best;
    finalEl.innerHTML = `Pontuação: <span>${score}</span><br><br>${isRecord ? '✦ Novo Recorde! ✦' : `Recorde: <span>${best}</span>`}`;
    gameOverScreen.classList.remove('hidden');

    let flashes = 0;
    const fi = setInterval(() => {
      ctx.fillStyle = `rgba(255,45,85,${0.12 - flashes * 0.02})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (++flashes >= 5) clearInterval(fi);
    }, 80);
  }

  const DIRS = {
    ArrowUp:    { x:  0, y: -1 }, w: { x:  0, y: -1 }, W: { x:  0, y: -1 },
    ArrowDown:  { x:  0, y:  1 }, s: { x:  0, y:  1 }, S: { x:  0, y:  1 },
    ArrowLeft:  { x: -1, y:  0 }, a: { x: -1, y:  0 }, A: { x: -1, y:  0 },
    ArrowRight: { x:  1, y:  0 }, d: { x:  1, y:  0 }, D: { x:  1, y:  0 },
  };

  function trySetDir(d) {
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'p' || e.key === 'P') {
      if (state === 'playing') pauseGame();
      else if (state === 'paused') resumeGame();
      return;
    }
    if (state !== 'playing') return;
    if (DIRS[e.key]) { e.preventDefault(); trySetDir(DIRS[e.key]); }
  });

  document.getElementById('btnUp').addEventListener('click',    () => trySetDir({ x:  0, y: -1 }));
  document.getElementById('btnDown').addEventListener('click',  () => trySetDir({ x:  0, y:  1 }));
  document.getElementById('btnLeft').addEventListener('click',  () => trySetDir({ x: -1, y:  0 }));
  document.getElementById('btnRight').addEventListener('click', () => trySetDir({ x:  1, y:  0 }));

  let touchStart = null;
  canvas.addEventListener('touchstart', e => { touchStart = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.clientX;
    const dy = e.changedTouches[0].clientY - touchStart.clientY;
    if (Math.abs(dx) > Math.abs(dy)) trySetDir(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    else trySetDir(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
    touchStart = null;
  });

  function pauseGame() {
    state = 'paused';
    clearInterval(gameLoop);
    pauseScreen.classList.remove('hidden');
  }

  function resumeGame() {
    state = 'playing';
    pauseScreen.classList.add('hidden');
    startTick();
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    startScreen.classList.add('hidden');
    state = 'playing';
    initGame();
    draw();
    startTick();
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    state = 'playing';
    initGame();
    draw();
    startTick();
  });

  document.getElementById('resumeBtn').addEventListener('click', resumeGame);

  initGame();
  draw();
  state = 'start';

  function idleLoop() {
    if (state === 'start') { draw(); requestAnimationFrame(idleLoop); }
  }
  idleLoop();

  document.getElementById('backBtn').addEventListener('click', () => {
  window.location.href = "index.html";
});
  document.getElementById('backBtn2').addEventListener('click', () => {
  window.location.href = "index.html";
});

</script>
</body>
</html>
