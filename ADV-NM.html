<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivinhe o Número</title>
  <link rel="stylesheet" href="ADV-NM.css">
</head>

<body>
  <div class="container">
    <h1>🔢 Adivinhe o Número</h1>
    <p class="subtitulo">Descubra o número secreto entre 1 e 100</p>

    <div class="area-jogo">
      <input type="number" id="palpite" placeholder="Digite seu palpite">
      <button onclick="verificarPalpite()">Tentar</button>
    </div>

    <div class="painel">
      <p id="dica">Boa sorte!</p>
      <p id="tentativas">Tentativas: 0</p>
    </div>

    <div class="acoes">
      <button onclick="reiniciarJogo()">Novo Jogo</button>
      <a href="index.html" class="voltar">⬅ Voltar</a>
    </div>
  </div>

  <script src="ADV.JS"></script>
</body>

</html>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1b1b3a, #0a0a16 70%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
  }

  .container {
    max-width: 700px;
    margin: auto;
  }

  h1 {
    color: #00e5ff;
    font-size: 2.4rem;
  }

  .subtitulo {
    color: #c9c9ff;
    margin: 10px 0 25px;
  }

  .area-jogo {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  input {
    padding: 14px;
    width: 240px;
    border-radius: 12px;
    border: none;
    outline: none;
    font-size: 1rem;
  }

  button {
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #8a2be2, #00e5ff);
    color: white;
    cursor: pointer;
    font-weight: bold;
  }

  .painel {
    margin-top: 25px;
    background: rgba(31, 31, 53, 0.95);
    padding: 25px;
    border-radius: 16px;
  }

  .acoes {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .voltar {
    text-decoration: none;
    background: #1f1f35;
    color: #00e5ff;
    padding: 14px 20px;
    border-radius: 12px;
    font-weight: bold;
  }
</style>
<script>
  let numeroSecreto = Math.floor(Math.random() * 100) + 1;
  let totalTentativas = 0;
  let jogoFinalizado = false;

  function verificarPalpite() {
    if (jogoFinalizado) return;

    const palpite = Number(document.getElementById("palpite").value);
    const dica = document.getElementById("dica");
    const tentativas = document.getElementById("tentativas");

    if (!palpite || palpite < 1 || palpite > 100) {
      dica.textContent = "Digite um número válido entre 1 e 100!";
      return;
    }

    totalTentativas++;

    if (palpite === numeroSecreto) {
      dica.textContent = `🎉 Parabéns! Você acertou o número ${numeroSecreto}!`;
      jogoFinalizado = true;
    } else if (palpite < numeroSecreto) {
      dica.textContent = "📈 O número secreto é MAIOR!";
    } else {
      dica.textContent = "📉 O número secreto é MENOR!";
    }

    tentativas.textContent = `Tentativas: ${totalTentativas}`;
    document.getElementById("palpite").value = "";
  }

  function reiniciarJogo() {
    numeroSecreto = Math.floor(Math.random() * 100) + 1;
    totalTentativas = 0;
    jogoFinalizado = false;
    document.getElementById("dica").textContent = "Boa sorte!";
    document.getElementById("tentativas").textContent = "Tentativas: 0";
    document.getElementById("palpite").value = "";
  }
</script>
