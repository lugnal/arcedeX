<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #4ec0ca;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  position: fixed;
  top: 0; left: 0;
}

#ui {
  position: fixed;
  top: 16px;
  left: 0; right: 0;
  text-align: center;
  pointer-events: none;
  z-index: 10;
}

#score-display {
  font-size: 42px;
  font-weight: 900;
  color: white;
  text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  letter-spacing: 2px;
}

/* OVERLAYS */
#menu-screen,
#gameover-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.35);
  z-index: 100;
}

#gameover-screen { display: none; }

.panel {
  background: #fff;
  border-radius: 20px;
  padding: 36px 44px;
  text-align: center;
  min-width: 300px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
}

.game-title {
  font-size: 36px;
  font-weight: 900;
  color: #f5a623;
  text-shadow: 0 3px 0 #c67c00;
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.game-sub {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 28px;
  letter-spacing: 1px;
}

.over-icon { font-size: 52px; margin-bottom: 8px; }

.over-title {
  font-size: 30px;
  font-weight: 900;
  color: #e74c3c;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.results {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}

.result-box {
  background: #f9f9f9;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 12px 10px;
}

.rlabel {
  font-size: 10px;
  color: #aaa;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.rval {
  font-size: 26px;
  font-weight: 700;
  color: #333;
}

.rval.best { color: #f5a623; }

.btn-row {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 13px 10px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.1s;
  letter-spacing: 0.5px;
}

.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.96); }

.btn-menu {
  background: #eee;
  color: #555;
}

.btn-play {
  background: #f5a623;
  color: #fff;
}

.btn-start {
  width: 100;
  padding: 15px;
  border-radius: 14px;
  border: none;
  background: #f5a623;
  color: #fff;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.1s;
  box-shadow: 0 4px 0 #c67c00;
}

.btn-start:hover { opacity: 0.9; }
.btn-start:active { transform: translateY(2px); box-shadow: 0 2px 0 #c67c00; }

.hint {
  font-size: 11px;
  color: #bbb;
  margin-top: 14px;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div id="score-display">0</div>
</div>

<!-- MENU -->
<div id="menu-screen">
  <div class="panel">
    <div class="game-title">FLAPPY</div>
    <div class="game-sub">B I R D</div>
    <button class="btn-start" id="btn-start">&#9654; JOGAR</button>
    <button onclick="Voltar()" class="btn-start">VOLTAR</button>
    <div class="hint">Clique, toque ou pressione Espa&ccedil;o para voar</div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover-screen">
  <div class="panel">
    <div class="over-icon">&#128128;</div>
    <div class="over-title">GAME OVER</div>
    <div class="results">
      <div class="result-box">
        <div class="rlabel">Score</div>
        <div class="rval" id="final-score">0</div>
      </div>
      <div class="result-box">
        <div class="rlabel">Melhor</div>
        <div class="rval best" id="final-best">0</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-menu" id="btn-menu">&larr; Menu</button>
      <button class="btn btn-play" id="btn-retry">&#8635; Tentar Novamente</button>
    </div>
  </div>
</div>

<script>
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;

var W = canvas.width;
var H = canvas.height;

// ---- STATE ----
var bird, pipes, particles, score, bestScore, running, dead;
var pipeTimer;
var groundY = H - 80;
var groundOffset = 0;
bestScore = 0;

function resetState() {
  bird = {
    x: 100, y: H / 2,
    w: 36, h: 28,
    vel: 0,
    gravity: 0.45,
    jump: -9,
    angle: 0,
    flapFrame: 0,
    flapTimer: 0
  };
  pipes = [];
  particles = [];
  score = 0;
  running = false;
  dead = false;
}

function Voltar() {
    window.location.href="index.html"
}

resetState();

// ---- BUTTONS ----
document.getElementById("btn-start").addEventListener("click", startGame);
document.getElementById("btn-retry").addEventListener("click", function() {
  document.getElementById("gameover-screen").style.display = "none";
  startGame();
});
document.getElementById("btn-menu").addEventListener("click", function() {
  document.getElementById("gameover-screen").style.display = "none";
  document.getElementById("menu-screen").style.display = "flex";
});

// ---- INPUT ----
function flap() {
  if (!running || dead) return;
  bird.vel = bird.jump;
  bird.flapFrame = 0;
  spawnFlapParticles();
}

window.addEventListener("keydown", function(e) {
  if (e.code === "Space" || e.key === " " || e.key === "ArrowUp") flap();
});
canvas.addEventListener("click", flap);
canvas.addEventListener("touchstart", function(e) { e.preventDefault(); flap(); }, { passive: false });

// ---- SPAWN ----
function spawnPipe() {
  if (!running || dead) return;
  var gap    = 165;
  var minTop = 80;
  var maxTop = groundY - gap - 80;
  var top    = minTop + Math.random() * (maxTop - minTop);
  pipes.push({
    x: W + 10,
    top: top,
    bottom: top + gap,
    w: 68,
    passed: false
  });
}

// ---- PARTICLES ----
function spawnFlapParticles() {
  for (var i = 0; i < 5; i++) {
    particles.push({
      x: bird.x + bird.w / 2,
      y: bird.y + bird.h,
      vx: (Math.random() - 0.5) * 2,
      vy: 1 + Math.random() * 2,
      life: 1,
      col: Math.random() > 0.5 ? "#fff" : "#ffe066"
    });
  }
}

function spawnDeathParticles() {
  for (var i = 0; i < 18; i++) {
    var ang = Math.random() * Math.PI * 2;
    var spd = 2 + Math.random() * 5;
    particles.push({
      x: bird.x + bird.w / 2,
      y: bird.y + bird.h / 2,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1,
      col: i % 2 === 0 ? "#f5a623" : "#ff4444"
    });
  }
}

// ---- UPDATE ----
function update() {
  if (!running) return;

  groundOffset = (groundOffset + 3) % 48;

  // Bird physics
  if (!dead) {
    bird.vel += bird.gravity;
    bird.y   += bird.vel;

    // Rotate based on velocity
    bird.angle = Math.max(-25, Math.min(70, bird.vel * 4));

    // Flap wing animation
    bird.flapTimer++;
    if (bird.flapTimer > 6) { bird.flapTimer = 0; bird.flapFrame = (bird.flapFrame + 1) % 3; }

    // Hit ground
    if (bird.y + bird.h >= groundY) {
      bird.y = groundY - bird.h;
      bird.vel = 0;
      spawnDeathParticles();
      endGame();
      return;
    }

    // Hit ceiling
    if (bird.y <= 0) {
      bird.y = 0;
      bird.vel = 0;
    }

    // Pipes
    for (var i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      p.x -= 3;

      if (!p.passed && p.x + p.w < bird.x) {
        score++;
        p.passed = true;
        if (score > bestScore) bestScore = score;
        document.getElementById("score-display").innerText = score;
      }

      // Collision
      if (bird.x + bird.w - 4 > p.x && bird.x + 4 < p.x + p.w) {
        if (bird.y + 4 < p.top || bird.y + bird.h - 4 > p.bottom) {
          spawnDeathParticles();
          endGame();
          return;
        }
      }
    }

    pipes = pipes.filter(function(p) { return p.x > -100; });
  }

  // Particles
  for (var k = particles.length - 1; k >= 0; k--) {
    var pt = particles[k];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12; pt.life -= 0.04;
    if (pt.life <= 0) particles.splice(k, 1);
  }
}

// ---- DRAW ----
function draw() {
  // Sky gradient
  var sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, "#5ab8d4");
  sky.addColorStop(1, "#8de0f0");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundY);

  // Background clouds (simple)
  drawClouds();

  // Pipes
  pipes.forEach(function(p) { drawPipe(p); });

  // Ground
  drawGround();

  // Particles
  particles.forEach(function(pt) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.col;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 5 * pt.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Bird
  drawBird();
}

// Static cloud positions
var clouds = [
  { x: W*0.1, y: 60, w: 100 },
  { x: W*0.35, y: 40, w: 140 },
  { x: W*0.6, y: 80, w: 110 },
  { x: W*0.82, y: 50, w: 130 }
];
var cloudOff = 0;

function drawClouds() {
  cloudOff = (cloudOff + 0.4) % W;
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  clouds.forEach(function(cl) {
    var cx = ((cl.x - cloudOff + W) % W);
    ctx.beginPath();
    ctx.ellipse(cx, cl.y, cl.w * 0.5, 22, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - cl.w * 0.22, cl.y + 10, cl.w * 0.3, 18, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + cl.w * 0.22, cl.y + 8, cl.w * 0.28, 16, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawPipe(p) {
  var capH = 24;
  var capExtra = 6;

  // Top pipe
  var gtop = ctx.createLinearGradient(p.x, 0, p.x + p.w, 0);
  gtop.addColorStop(0, "#3a9e3a");
  gtop.addColorStop(0.4, "#5ccf5c");
  gtop.addColorStop(1, "#2a7a2a");
  ctx.fillStyle = gtop;
  ctx.fillRect(p.x, 0, p.w, p.top - capH);

  // Top cap
  ctx.fillStyle = "#4ab84a";
  ctx.fillRect(p.x - capExtra, p.top - capH, p.w + capExtra * 2, capH);
  ctx.fillStyle = "#5ccf5c";
  ctx.fillRect(p.x - capExtra + 4, p.top - capH + 2, 10, capH - 4);

  // Bottom pipe
  var gbot = ctx.createLinearGradient(p.x, 0, p.x + p.w, 0);
  gbot.addColorStop(0, "#3a9e3a");
  gbot.addColorStop(0.4, "#5ccf5c");
  gbot.addColorStop(1, "#2a7a2a");
  ctx.fillStyle = gbot;
  ctx.fillRect(p.x, p.bottom + capH, p.w, groundY - p.bottom - capH);

  // Bottom cap
  ctx.fillStyle = "#4ab84a";
  ctx.fillRect(p.x - capExtra, p.bottom, p.w + capExtra * 2, capH);
  ctx.fillStyle = "#5ccf5c";
  ctx.fillRect(p.x - capExtra + 4, p.bottom + 4, 10, capH - 8);
}

function drawGround() {
  // Ground base
  ctx.fillStyle = "#c8a84b";
  ctx.fillRect(0, groundY, W, H - groundY);

  // Ground top strip
  ctx.fillStyle = "#8bc34a";
  ctx.fillRect(0, groundY, W, 18);

  // Animated tiles
  ctx.fillStyle = "#d4b456";
  for (var tx = -groundOffset; tx < W; tx += 48) {
    ctx.fillRect(tx, groundY + 20, 42, 10);
    ctx.fillRect(tx + 24, groundY + 34, 42, 10);
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
  ctx.rotate(bird.angle * Math.PI / 180);

  // Body
  ctx.fillStyle = "#f5c100";
  ctx.beginPath();
  ctx.ellipse(0, 0, bird.w / 2, bird.h / 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wing
  var wingY = bird.flapFrame === 0 ? 4 : bird.flapFrame === 1 ? 0 : -5;
  ctx.fillStyle = "#e6a800";
  ctx.beginPath();
  ctx.ellipse(-4, wingY, 10, 6, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = "#ffe066";
  ctx.beginPath();
  ctx.ellipse(4, 3, 8, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eye white
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(9, -5, 7, 0, Math.PI * 2);
  ctx.fill();

  // Pupil
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(11, -5, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Eye shine
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(12, -6.5, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = "#ff8c00";
  ctx.beginPath();
  ctx.moveTo(14, -1);
  ctx.lineTo(22, 1);
  ctx.lineTo(14, 4);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ---- LOOP ----
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ---- FLOW ----
function startGame() {
  document.getElementById("menu-screen").style.display = "none";
  document.getElementById("gameover-screen").style.display = "none";
  document.getElementById("score-display").innerText = "0";
  resetState();
  running = true;
  clearInterval(pipeTimer);
  pipeTimer = setInterval(spawnPipe, 1600);
}

function endGame() {
  dead = true;
  running = false;
  clearInterval(pipeTimer);
  document.getElementById("final-score").innerText = score;
  document.getElementById("final-best").innerText = bestScore;
  setTimeout(function() {
    document.getElementById("gameover-screen").style.display = "flex";
  }, 700);
}

loop();
</script>
</body>
</html>
